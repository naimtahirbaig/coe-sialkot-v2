  function onRootClick(e) {
    // The overlay backdrop closes the drawer, but ONLY on a direct hit on the
    // backdrop itself (e.target === the .overlay div) — never for a click on
    // anything inside it. This must be checked before the closest()-based
    // dispatch below: any element inside the drawer that has its own
    // data-action (a chip, a button) should fire THAT action, and anything
    // else inside the drawer (a plain input, a label, empty padding) should
    // do nothing at all rather than closing the form the person is filling in.
    if (e.target.classList && e.target.classList.contains("overlay")) {
      state.drawerOpen = false; render(); return;
    }

    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");

    switch (action) {
      case "nav-view":
        state.view = el.getAttribute("data-value");
        state.rosterAddOpen = false; state.rosterImportOpen = false;
        render();
        break;
      case "roster-tab":
        state.rosterTab = el.getAttribute("data-value");
        state.rosterAddOpen = false; state.rosterImportOpen = false;
        render();
        break;
      case "toggle-roster-add":
        state.rosterAddOpen = !state.rosterAddOpen; state.rosterImportOpen = false;
        render();
        break;
      case "toggle-roster-import":
        state.rosterImportOpen = !state.rosterImportOpen; state.rosterAddOpen = false;
        render();
        break;
      case "submit-add-student": {
        var name = valueOf("rs_name");
        if (!name) { showToast("Please enter the student's name."); return; }
        var grade = valueOf("rs_grade") || "6";
        addStudent({
          name: name, rollNo: valueOf("rs_roll"), grade: grade,
          section: grade === "other" ? "" : valueOf("rs_section"),
          customClass: grade === "other" ? valueOf("rs_custom") : ""
        });
        state.rosterAddOpen = false;
        showToast("Student added.");
        break;
      }
      case "submit-add-teacher": {
        var tname = valueOf("rt_name");
        if (!tname) { showToast("Please enter a name."); return; }
        addTeacher({
          name: tname, role: valueOf("rt_role") || "Invigilator",
          classTeacherGrade: valueOf("rt_ctgrade"), classTeacherSection: valueOf("rt_ctsection")
        });
        state.rosterAddOpen = false;
        showToast("Staff member added.");
        break;
      }
      case "submit-import-students": {
        var stxt = valueOf("importStudentsText");
        bulkImportStudents(stxt);
        break;
      }
      case "submit-import-teachers": {
        var ttxt = valueOf("importTeachersText");
        bulkImportTeachers(ttxt);
        break;
      }
      case "delete-student":
        deleteStudent(el.getAttribute("data-id"));
        break;
      case "delete-teacher":
        deleteTeacher(el.getAttribute("data-id"));
        break;
      case "toggle-offense": {
        el.classList.toggle("active");
        var otherChip = Array.prototype.find.call(document.querySelectorAll(".offense-chip"), function (c) { return c.getAttribute("data-value") === "Other"; });
        var otherInput = document.getElementById("f_offenseOther");
        if (otherInput && otherChip) otherInput.style.display = otherChip.classList.contains("active") ? "" : "none";
        updateAutoDescription();
        break;
      }
      case "remove-draft-evidence":
        removeDraftEvidence(el.getAttribute("data-cat"), el.getAttribute("data-id"), el);
        break;
      case "filter-status": state.filterStatus = el.getAttribute("data-value"); render(); break;
      case "filter-grade": state.filterGrade = el.getAttribute("data-value"); render(); break;
      case "select-case":
        state.selectedId = el.getAttribute("data-id"); state.mobileDetailOpen = true; state.openAction = null; render();
        break;
      case "back-to-list": state.mobileDetailOpen = false; render(); break;
      case "close-drawer": state.drawerOpen = false; render(); break;
      case "close-lightbox": state.lightboxUrl = null; render(); break;
      case "view-evidence": state.lightboxUrl = el.getAttribute("data-url"); render(); break;
      case "open-camera": {
        var camCategory = el.getAttribute("data-category");
        var camCaseId = el.getAttribute("data-case-target") ? state.selectedId : null;
        openCamera(camCategory, camCaseId);
        break;
      }
      case "camera-cancel": closeCamera(); break;
      case "camera-shutter": capturePhotoFromCamera(); break;
      case "open-advance": state.openAction = "advance"; state.openActionId = el.getAttribute("data-id"); render(); break;
      case "cancel-inline": state.openAction = null; state.openActionId = null; render(); break;
      case "use-quick-note": {
        var targetId = el.getAttribute("data-target");
        var targetEl = document.getElementById(targetId);
        if (targetEl) { targetEl.value = el.getAttribute("data-text"); targetEl.focus(); }
        break;
      }
      case "submit-advance": {
        var advCaseId = el.getAttribute("data-id");
        var advCase = getCase(advCaseId);
        var advStep = advCase && CASE_CHAIN[advCase.status];
        if (!advCase || !advStep) break;
        if (advStep.isDecision) {
          var decText = valueOf("decText");
          if (!decText) { showToast("Please record the decision."); return; }
          advanceCase(advCaseId, null, {
            text: decText,
            decidedBy: valueOf("decBy") || seniorCoordinatorFor(advCase.grade),
            action: valueOf("recAction"),
            at: new Date().toISOString()
          });
        } else {
          advanceCase(advCaseId, valueOf("advanceNote"), null);
        }
        break;
      }
      case "reopen-case": reopenCase(el.getAttribute("data-id")); break;
      case "print-case": window.print(); break;
      case "open-letter":
        state.letterView = { type: el.getAttribute("data-type"), caseId: el.getAttribute("data-id") };
        render();
        break;
      case "close-letter":
        state.letterView = null;
        render();
        break;
    }
  }

  function valueOf(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : "";
  }

  function populateDrawerDynamic() {
    var gradeSel = document.getElementById("f_grade");
    var sectionSel = document.getElementById("f_section");
    var studentWrap = document.getElementById("studentFieldWrap");
    if (!gradeSel || !sectionSel) return;
    var grade = gradeSel.value || "6";
    var isOther = grade === "other";
    var sections = SECTIONS_BY_GRADE[grade] || [];
    sectionSel.innerHTML = sections.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + "</option>"; }).join("") || '<option value="">—</option>';
    sectionSel.parentElement.style.display = isOther ? "none" : "";
    if (studentWrap) studentWrap.style.display = isOther ? "none" : "";
    // f_studentNameOther and f_customClass are the only two fields marked
    // data-other-class-field="1" — both only apply to "other" grades.
    Array.prototype.forEach.call(document.querySelectorAll('[data-other-class-field="1"]'), function (el) {
      el.style.display = isOther ? "" : "none";
    });
    populateStudentOptions();
  }

  function populateStudentOptions() {
    var gradeSel = document.getElementById("f_grade");
    var sectionSel = document.getElementById("f_section");
    var studentSel = document.getElementById("f_student");
    if (!gradeSel || !studentSel) return;
    var grade = gradeSel.value || "6";
    if (grade === "other") { studentSel.innerHTML = ""; return; }
    var section = sectionSel ? sectionSel.value : "";
    var list = studentsForGradeSection(grade, section);
    studentSel.innerHTML = '<option value="">— Select student —</option>' +
      list.map(function (s) {
        return '<option value="' + esc(s._id) + '">' + esc(s.name) + (s.rollNo ? " (Roll " + esc(s.rollNo) + ")" : "") + "</option>";
      }).join("");
    var rollField = document.getElementById("f_rollNo");
    if (rollField) rollField.value = "";
    draftSelectedStudentId = null;
  }

  function toggleOtherField(selectId, otherFieldId, otherValue) {
    var sel = document.getElementById(selectId);
    var other = document.getElementById(otherFieldId);
    if (!sel || !other) return;
    var wrap = other.closest(".form-field");
    var show = sel.value === (otherValue || "Other");
    if (wrap) wrap.style.display = show ? "" : "none";
  }

  // Builds a short description from the currently-checked offense chips.
  // Only overwrites the textarea if it's empty or still holds exactly what
  // we last auto-generated — so it never clobbers something the
  // invigilator typed themselves.
  function updateAutoDescription() {
    var box = document.getElementById("f_description");
    if (!box) return;
    var current = box.value;
    if (current !== "" && current !== draftAutoDescription) return;
    var active = Array.prototype.map.call(document.querySelectorAll(".offense-chip.active"), function (c) { return c.getAttribute("data-value"); });
    var sentences = active.map(function (o) { return OFFENSE_DESCRIPTIONS[o]; }).filter(Boolean);
    var generated = sentences.join(" ");
    draftAutoDescription = generated;
    box.value = generated;
  }

  function handleSubmitReport() {
    var grade = valueOf("f_grade") || "6";
    var isOther = grade === "other";
    var studentName, studentId = null, rollNo, section;

    if (isOther) {
      studentName = valueOf("f_studentNameOther");
      rollNo = valueOf("f_rollNo");
      section = "";
    } else {
      var studentSel = document.getElementById("f_student");
      studentId = studentSel ? studentSel.value : "";
      var student = studentId ? state.students.filter(function (s) { return s._id === studentId; })[0] : null;
      studentName = student ? student.name : "";
      rollNo = student ? (student.rollNo || "") : "";
      section = valueOf("f_section");
    }

    var reporterSel = document.getElementById("f_reporter");
    var reporterId = reporterSel ? reporterSel.value : "";
    var reporter = reporterId ? state.teachers.filter(function (t) { return t._id === reporterId; })[0] : null;
    var invigilatorName = reporter ? reporter.name : "";

    var description = valueOf("f_description");

    if (!studentName) { showToast(isOther ? "Please enter the student's name." : "Please select a student."); return; }
    if (!invigilatorName) { showToast("Please select who is reporting this."); return; }
    if (!description) { showToast("Please describe the incident."); return; }

    var subject = valueOf("f_subject");
    if (subject === "Other") subject = valueOf("f_subjectOther");
    var room = valueOf("f_room");
    if (room === "Other") room = valueOf("f_roomOther");

    var offenseTypes = Array.prototype.map.call(document.querySelectorAll(".offense-chip.active"), function (c) { return c.getAttribute("data-value"); });

    var payload = {
      studentId: studentId,
      studentName: studentName,
      rollNo: rollNo,
      grade: grade,
      section: section,
      customClass: isOther ? valueOf("f_customClass") : "",
      subject: subject,
      examDate: valueOf("f_examDate"),
      room: room,
      reporterId: reporterId || null,
      invigilatorName: invigilatorName,
      offenseTypes: offenseTypes,
      offenseOther: offenseTypes.indexOf("Other") > -1 ? valueOf("f_offenseOther") : "",
      invigilatorAction: valueOf("f_invigilatorAction"),
      description: description
    };
    state.myName = invigilatorName;
    localStorage.setItem("umc_name", invigilatorName);
    createCase(payload);
  }

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  // Bound to `document`, not `root` — the drawer/lightbox live in
  // #overlayLayer, a sibling of #app, so a listener on `root` alone would
  // never see clicks inside them.
  document.addEventListener("click", onRootClick);
  render();
  initCapabilities();
})();

</script>
</body>
</html>
