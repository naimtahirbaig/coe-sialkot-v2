<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMC Case Register — Centre of Excellence (B), Sialkot</title>
<style>
  :root {
    --navy: #14213D;
    --navy-deep: #0E1930;
    --navy-mid: #1C2E52;
    --gold: #C9972B;
    --gold-soft: #E7C878;
    --paper: #F1F3F6;
    --paper-dim: #E7EAEF;
    --card: #FFFFFF;
    --ink: #16233F;
    --muted: #5B6B84;
    --line: #DFE3EA;

    --status-reported: #C2542E;
    --status-reported-bg: #FBEAE3;
    --status-controller: #2E6FB2;
    --status-controller-bg: #E4EFFA;
    --status-coordinator: #0E8F8A;
    --status-coordinator-bg: #DEF4F2;
    --status-senior: #7B4FA6;
    --status-senior-bg: #F1E9F7;
    --status-principal: #B8860B;
    --status-principal-bg: #FBF2DC;
    --status-closed: #1E8A78;
    --status-closed-bg: #E2F2EF;
    /* legacy aliases kept so nothing else in this file needs renaming */
    --status-review: #2E6FB2;
    --status-review-bg: #E4EFFA;
    --status-recommended: #7B4FA6;
    --status-recommended-bg: #F1E9F7;

    --radius-card: 10px;
    --radius-tag: 4px;
    --serif: 'DejaVu Serif Condensed', 'Liberation Serif', Georgia, serif;
    --sans: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;
    --mono: 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--paper);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  a { color: inherit; }

  /* ---------------- Login screen ---------------- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    padding: 24px;
  }
  .login-card {
    background: var(--card);
    border-radius: var(--radius-card);
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  /* ---------------- Top bar ---------------- */
  .topbar {
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    padding: 18px 28px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-eyebrow {
    font-size: 12.5px;
    color: var(--gold-soft);
  }
  .brand-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 25px;
    color: #FFFFFF;
    letter-spacing: 0.2px;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .role-select {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(231,200,120,0.4);
    color: #F3EFE2;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13.5px;
  }
  .role-select option { color: #16233F; }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-gold {
    background: linear-gradient(155deg, var(--gold) 0%, #B5811F 100%);
    color: #241804;
    box-shadow: 0 1px 3px rgba(184,134,11,0.35);
  }
  .btn-gold:hover { background: var(--gold-soft); box-shadow: 0 2px 6px rgba(184,134,11,0.45); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .btn-outline:hover { background: var(--paper-dim); }
  .btn-outline-light {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.35);
    color: #EDEFF3;
  }
  .btn-outline-light:hover { background: rgba(255,255,255,0.08); }
  .btn-small { padding: 6px 11px; font-size: 12.5px; border-radius: 6px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------------- Tally strip ---------------- */
  .tally {
    display: flex;
    gap: 0;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .tally-item {
    flex: 1 1 0;
    min-width: 130px;
    padding: 14px 20px;
    border-right: 1px solid var(--line);
    border-top: 3px solid transparent;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tally-item[data-status="reported"] { border-top-color: var(--status-reported); }
  .tally-item[data-status="controller_review"] { border-top-color: var(--status-controller); }
  .tally-item[data-status="coordinator_review"] { border-top-color: var(--status-coordinator); }
  .tally-item[data-status="senior_review"] { border-top-color: var(--status-senior); }
  .tally-item[data-status="principal_review"] { border-top-color: var(--status-principal); }
  .tally-item[data-status="closed"] { border-top-color: var(--status-closed); }
  .tally-item:last-child { border-right: none; }
  .tally-num {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 26px;
    line-height: 1;
  }
  .tally-label {
    font-size: 12px;
    color: var(--muted);
  }
  .tally-item[data-status="reported"] .tally-num { color: var(--status-reported); }
  .tally-item[data-status="controller_review"] .tally-num { color: var(--status-controller); }
  .tally-item[data-status="coordinator_review"] .tally-num { color: var(--status-coordinator); }
  .tally-item[data-status="senior_review"] .tally-num { color: var(--status-senior); }
  .tally-item[data-status="principal_review"] .tally-num { color: var(--status-principal); }
  .tally-item[data-status="closed"] .tally-num { color: var(--status-closed); }
  .tally-item[data-status="total"] .tally-num { color: var(--navy); }
  .tally-item { position: relative; }
  .tally-item.active { background: var(--paper-dim); }

  /* ---------------- Layout ---------------- */
  .main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    align-items: start;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 880px) {
    .main { grid-template-columns: 1fr; }
    .rail { border-right: none; border-bottom: 1px solid var(--line); }
    .detail-pane.mobile-hidden { display: none; }
    .rail.mobile-hidden { display: none; }
  }

  /* ---------------- Rail (filters + list) ---------------- */
  .rail {
    border-right: 1px solid var(--line);
    background: var(--card);
    min-height: calc(100vh - 130px);
    display: flex;
    flex-direction: column;
  }
  .rail-section {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }
  .search-box {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13.5px;
  }
  .search-box:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .chip.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .filter-title {
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 2px;
    text-transform: none;
  }
  .rail-list {
    flex: 1;
    overflow-y: auto;
  }
  .case-row {
    padding: 12px 18px 12px 15px;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .case-row:hover { background: var(--paper); }
  .case-row.active { background: var(--paper-dim); }
  .case-row[data-status="reported"] { border-left-color: var(--status-reported); }
  .case-row[data-status="controller_review"] { border-left-color: var(--status-controller); }
  .case-row[data-status="coordinator_review"] { border-left-color: var(--status-coordinator); }
  .case-row[data-status="senior_review"] { border-left-color: var(--status-senior); }
  .case-row[data-status="principal_review"] { border-left-color: var(--status-principal); }
  .case-row[data-status="closed"] { border-left-color: var(--status-closed); }
  .case-row.active { border-left-width: 4px; }
  .case-row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .case-row-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
  }
  .case-row-code {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .case-row-meta {
    font-size: 12px;
    color: var(--muted);
  }
  .empty-list {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* ---------------- Status tag ---------------- */
  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px 3px 7px;
    border-radius: var(--radius-tag);
    white-space: nowrap;
  }
  .status-tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-tag[data-status="reported"] { background: var(--status-reported-bg); color: var(--status-reported); }
  .status-tag[data-status="reported"]::before { background: var(--status-reported); }
  .status-tag[data-status="controller_review"] { background: var(--status-controller-bg); color: var(--status-controller); }
  .status-tag[data-status="controller_review"]::before { background: var(--status-controller); }
  .status-tag[data-status="coordinator_review"] { background: var(--status-coordinator-bg); color: var(--status-coordinator); }
  .status-tag[data-status="coordinator_review"]::before { background: var(--status-coordinator); }
  .status-tag[data-status="senior_review"] { background: var(--status-senior-bg); color: var(--status-senior); }
  .status-tag[data-status="senior_review"]::before { background: var(--status-senior); }
  .status-tag[data-status="principal_review"] { background: var(--status-principal-bg); color: var(--status-principal); }
  .status-tag[data-status="principal_review"]::before { background: var(--status-principal); }
  .status-tag[data-status="closed"] { background: var(--status-closed-bg); color: var(--status-closed); }
  .status-tag[data-status="closed"]::before { background: var(--status-closed); }

  /* ---------------- Detail pane ---------------- */
  .detail-pane {
    padding: 24px 32px 60px 32px;
    min-height: calc(100vh - 130px);
  }
  .detail-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: var(--muted);
    text-align: center;
    gap: 10px;
  }
  .detail-empty-title {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--ink);
    font-weight: 700;
  }
  .back-link {
    display: none;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--navy);
    font-weight: 700;
  }
  @media (max-width: 880px) {
    .back-link { display: inline-flex; align-items: center; gap: 5px; }
  }

  .file-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .file-code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }
  .file-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 27px;
    color: var(--ink);
    margin: 0;
  }
  .file-subtitle {
    font-size: 13.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  .file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 18px 20px;
    margin: 20px 0;
  }
  .file-field-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .file-field-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .section-block {
    margin: 24px 0;
  }
  .section-heading {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 17px;
    color: var(--ink);
    margin: 0 0 10px 0;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--paper-dim);
  }
  .desc-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .evidence-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .evidence-thumb {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .evidence-upload-btn {
    width: 96px;
    height: 96px;
    border-radius: 8px;
    border: 1.5px dashed var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 24px;
    background: var(--paper);
  }
  .evidence-upload-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* Decision / recommendation callouts */
  .callout {
    border-radius: var(--radius-card);
    padding: 16px 18px;
    margin: 14px 0;
    border-left: 4px solid var(--line);
    background: var(--paper);
  }
  .callout[data-kind="recommendation"] { border-left-color: var(--status-recommended); background: var(--status-recommended-bg); }
  .callout[data-kind="decision"] { border-left-color: var(--status-closed); background: var(--status-closed-bg); }
  .callout-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .callout-body { font-size: 14px; line-height: 1.55; }
  .callout-meta { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  /* Timeline */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .timeline-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--paper-dim);
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--navy);
    margin-top: 6px;
    flex-shrink: 0;
  }
  .timeline-text { font-size: 13.5px; line-height: 1.5; }
  .timeline-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .note-form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: flex-start;
  }
  .note-form textarea {
    flex: 1;
    resize: vertical;
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13.5px;
  }

  /* Action bar */
  .action-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  /* ---------------- Drawer (new report) ---------------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(14,25,48,0.45);
    z-index: 100;
    display: flex;
    justify-content: flex-end;
  }
  .drawer {
    width: min(560px, 100%);
    background: var(--card);
    height: 100%;
    overflow-y: auto;
    padding: 26px 28px 100px 28px;
    padding-top: calc(26px + env(safe-area-inset-top, 0px));
  }
  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .drawer-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 22px;
  }
  .close-btn {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--muted);
    line-height: 1;
    padding: 4px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .form-field input, .form-field select, .form-field textarea {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13.5px;
    width: 100%;
  }
  .form-field textarea { resize: vertical; min-height: 90px; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    outline: 2px solid var(--gold); outline-offset: 0px;
  }
  .required-mark { color: var(--status-reported); }
  .drawer-footer {
    position: sticky;
    bottom: 0;
    background: var(--card);
    padding-top: 16px;
    margin-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .field-hint { font-size: 11.5px; color: var(--muted); }

  /* Confidentiality note */
  .confidential-note {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
    padding: 14px 18px;
    background: var(--paper);
  }
  .confidential-note b { color: var(--ink); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy-deep);
    color: #fff;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 13.5px;
    z-index: 200;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,15,26,0.88);
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lightbox-close {
    position: absolute;
    top: 18px; right: 22px;
    background: none; border: none;
    color: #fff; font-size: 28px;
  }

  /* ---------------- In-page camera (real camera, not gallery) ---------------- */
  .camera-modal {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 220;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .camera-modal video {
    max-width: 100%;
    max-height: calc(100vh - 100px);
    background: #000;
  }
  .camera-controls {
    position: absolute;
    bottom: 22px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
  }
  .camera-shutter-btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid rgba(255,255,255,0.4);
  }
  .camera-cancel-btn {
    position: absolute;
    top: 18px; right: 22px;
    background: rgba(0,0,0,0.5);
    border: none;
    color: #fff;
    font-size: 24px;
    width: 40px; height: 40px;
    border-radius: 50%;
  }
  .camera-error {
    color: #fff;
    text-align: center;
    padding: 0 24px;
    font-size: 14px;
    line-height: 1.5;
  }

  .role-hint {
    font-size: 10.5px;
    color: rgba(255,255,255,0.55);
  }

  /* ---------------- Nav toggle (Cases / Rosters) ---------------- */
  .nav-toggle {
    display: flex;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(231,200,120,0.3);
    border-radius: 8px;
    overflow: hidden;
  }
  .nav-toggle button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.75);
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
  }
  .nav-toggle button.active {
    background: var(--gold);
    color: #241804;
  }

  /* ---------------- Typeahead ---------------- */
  .typeahead-wrap { position: relative; }
  .typeahead-suggestions {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 22px rgba(20,33,61,0.16);
    z-index: 30;
    max-height: 230px;
    overflow-y: auto;
  }
  .typeahead-item {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13.5px;

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
/* ===================================================================
   UMC Case Register — Centre of Excellence (B), Sialkot

   Backed by Supabase via the API routes under /api/case-register/*
   (see supabaseAdmin.js and case-register-schema.sql). Polls every
   POLL_MS so multiple staff members see each other's updates.

   Tables (snake_case columns, mapped to the shapes below on read):
   - cases:    { caseCode, studentId, studentName, rollNo, grade, section,
                 customClass, subject, examDate, room, reporterId,
                 invigilatorName, description, offenseTypes[], offenseOther,
                 invigilatorAction, status, reportedAt,
                 studentPhotoIds[], paperPhotoIds[], materialPhotoIds[],
                 notes[], forwarded, recommendation, decision, closedAt }
   - students: { name, rollNo, grade, section, customClass, photoAssetId, createdAt }
   - teachers: { name, role, classTeacherGrade, classTeacherSection, createdAt }
=================================================================== */

(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Constants
  // ---------------------------------------------------------------
  var SECTIONS_BY_GRADE = {
    "6": ["Jinnah", "Iqbal", "Sir Syed", "Liaqat", "Tipu", "Babar"],
    "7": ["Jinnah", "Iqbal", "Sir Syed", "Liaqat", "Tipu", "Babar"],
    "8": ["Jinnah", "Iqbal", "Sir Syed", "Liaqat", "Tipu", "Babar", "Abdali"],
    "9": ["Jinnah", "Iqbal", "Sir Syed", "Liaqat", "Tipu", "Babar"],
    "10": ["Jinnah", "Iqbal", "Sir Syed", "Liaqat", "Tipu", "Babar"],
    "other": []
  };

  var STATUS_LABEL = {
    reported: "Reported",
    controller_review: "With Controller",
    coordinator_review: "With Class Coordinator",
    senior_review: "With Senior Coordinator",
    principal_review: "With Principal",
    closed: "Closed"
  };

  // Fixed review chain. Each case is routed automatically to the named
  // person for its grade — no manual "pick who to send it to" step.
  var CONTROLLER_NAME = "Shahid Ali";
  var CLASS_COORDINATORS = { "6": "Kh. Aleem Zakria", "7": "Ahmed Raza", "8": "Altaf Kasana" };
  var SENIOR_COORDINATOR_LOWER = "Dr. Naim Tahir Baig"; // grades 6–8
  var SENIOR_COORDINATOR_UPPER = "Aqeel Iftikhar Awan";  // grades 9–10

  function classCoordinatorFor(grade) {
    return CLASS_COORDINATORS[grade] || "Class Coordinator";
  }
  function seniorCoordinatorFor(grade) {
    var g = parseInt(grade, 10);
    return (g >= 9) ? SENIOR_COORDINATOR_UPPER : SENIOR_COORDINATOR_LOWER;
  }

  // The five-step chain: Invigilator (files) → Controller → Class
  // Coordinator → Senior Coordinator (decision) → Principal (rectifies).
  // Keyed by the case's CURRENT status; describes the action that moves
  // it to the next one.
  var CASE_CHAIN = {
    reported: {
      next: "controller_review",
      tag: "controller-forward",
      buttonLabel: function () { return "Send to Controller — " + CONTROLLER_NAME; },
      noteLabel: "Note for the Controller (optional)"
    },
    controller_review: {
      next: "coordinator_review",
      tag: "coordinator-forward",
      buttonLabel: function (c) { return "Refer to Class Coordinator — " + classCoordinatorFor(c.grade); },
      noteLabel: "Controller's note (" + CONTROLLER_NAME + ")"
    },
    coordinator_review: {
      next: "senior_review",
      tag: "senior-forward",
      buttonLabel: function (c) { return "Refer to Senior Coordinator — " + seniorCoordinatorFor(c.grade); },
      noteLabel: "Class Coordinator's note"
    },
    senior_review: {
      next: "principal_review",
      tag: "senior-decision",
      isDecision: true,
      buttonLabel: function () { return "Record decision & refer to Principal"; },
      noteLabel: "Decision"
    },
    principal_review: {
      next: "closed",
      tag: "principal-close",
      setsClosedAt: true,
      buttonLabel: function () { return "Close case (rectified) — Principal"; },
      noteLabel: "Principal's rectification note (optional)"
    }
  };

  // A short bank of ready-made notes for each stage, so staff can tap
  // one instead of typing from scratch (still editable afterwards).
  var DEFAULT_NOTES = {
    "controller-forward": [
      "Reviewed the invigilator's report — details appear consistent. Forwarding for the class coordinator's review.",
      "Spoke with the invigilator to confirm the details before forwarding."
    ],
    "coordinator-forward": [
      "Reviewed the case with the student. Forwarding to the senior coordinator with a recommendation for review.",
      "Student's explanation noted. Referring for a decision."
    ],
    "senior-forward": [
      "Case reviewed in full. Referring to the senior coordinator for a decision.",
      "Discussed with the class coordinator — recommend proceeding to a decision."
    ],
    "senior-decision": [
      "Case reviewed. Unfair means confirmed — recommend action per policy.",
      "Case reviewed. Evidence inconclusive — recommend no further action.",
      "First offense — recommend a warning and counselling."
    ],
    "principal-close": [
      "Decision implemented and communicated to the student and parents. Case closed.",
      "Reviewed and rectified per the recommended decision."
    ],
    "note": [
      "Parent contacted and informed.",
      "Student statement recorded.",
      "Awaiting further information before proceeding."
    ]
  };

  var ACTION_OPTIONS = [
    "No unfair means found",
    "Warning issued",
    "Paper / question cancelled",
    "Suspension recommended",
    "Expulsion recommended",
    "Other (see decision notes)"
  ];

  // Quick-select offense categories the invigilator can tag on the spot.
  // Editable here if the school uses different board terminology.
  var OFFENSE_TYPES = [
    "Chit / written material found",
    "Copying from another candidate",
    "Mobile phone / electronic device",
    "Talking or exchanging answers",
    "Unauthorized book or notes",
    "Impersonation",
    "Tampering with roll no. / answer sheet",
    "Misconduct with staff",
    "Other"
  ];

  // The invigilator's own on-the-spot suggestion — distinct from the
  // Committee's later, binding recommendation.
  var INVIGILATOR_ACTIONS = [
    "Refer to committee — no immediate action taken",
    "Verbal warning given",
    "Material confiscated",
    "Candidate moved / seat changed",
    "Recommend paper cancellation",
    "Recommend immediate removal from exam",
    "Other — see description"
  ];

  var TEACHER_ROLES = [
    "Invigilator", "Controller", "Committee — Convenor",
    "Committee — Member", "Committee — Secretary", "Class Teacher", "Other"
  ];

  var SUBJECTS = [
    "Mathematics", "English", "Urdu", "Science", "Physics", "Chemistry",
    "Biology", "Computer Science", "Islamiyat", "Pakistan Studies",
    "Social Studies", "Other"
  ];

  // One short, editable sentence per offense type — dropped into the
  // description box automatically when that chip is selected, so the
  // invigilator starts from a filled-in sentence instead of a blank box.
  var OFFENSE_DESCRIPTIONS = {
    "Chit / written material found": "A chit / written material with unauthorized content was found in the candidate's possession.",
    "Copying from another candidate": "The candidate was seen copying from another candidate's answer sheet.",
    "Mobile phone / electronic device": "A mobile phone / electronic device was found in the candidate's possession during the exam.",
    "Talking or exchanging answers": "The candidate was talking to / exchanging answers with another candidate.",
    "Unauthorized book or notes": "The candidate was found with an unauthorized book or notes during the exam.",
    "Impersonation": "The candidate is suspected of impersonating another registered student.",
    "Tampering with roll no. / answer sheet": "The candidate was found tampering with the roll number or answer sheet.",
    "Misconduct with staff": "The candidate engaged in misconduct towards invigilation staff.",
    "Other": ""
  };

  // ---------------------------------------------------------------
  // Auth (teacher / admin login gate)
  // ---------------------------------------------------------------
  var AUTH_STORAGE_KEY = "umc_auth";
  var authToken = null;
  var authRole = null; // "teacher" | "admin"
  try {
    var savedAuth = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || "null");
    if (savedAuth && savedAuth.token && savedAuth.role) {
      authToken = savedAuth.token;
      authRole = savedAuth.role;
    }
  } catch (e) {}
  function isAdmin() { return authRole === "admin"; }

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  var state = {
    view: "cases", // "cases" | "rosters"
    rosterTab: "students", // "students" | "teachers"
    cases: [],
    students: [],
    teachers: [],
    dbAvailable: null,
    cameraOpen: false,
    role: localStorage.getItem("umc_role") || "invigilator",
    myName: localStorage.getItem("umc_name") || "",
    filterStatus: "all",
    filterGrade: "all",
    search: "",
    selectedId: null,
    drawerOpen: false,
    lightboxUrl: null,
    mobileDetailOpen: false,
    uploading: false,
    toast: null,
    openAction: null,
    openActionId: null,
    rosterSearch: "",
    rosterAddOpen: false,
    rosterImportOpen: false,
    letterView: null // { type: "initiation" | "closure", caseId }
  };

  // Draft evidence collected DURING report filing, before the case document
  // exists. Kept OUTSIDE `state` so uploading a photo never triggers a full
  // re-render of the drawer (which would wipe whatever else the invigilator
  // has already typed — see note above renderDrawer()).
  var draftEvidence = { student: [], paper: [], material: [] };
  var draftSelectedStudentId = null;
  var draftSelectedReporterId = null;
  var draftAutoDescription = ""; // last value WE wrote into the description box
  var cameraStream = null;
  var cameraTargetCategory = null;
  var cameraTargetCaseId = null; // null = draft (new report); set = an existing case

  // Base path for the case-register API routes deployed alongside this
  // page (src/app/api/case-register/... in the Next.js project).
  var API_BASE = "/api/case-register";
  var POLL_MS = 8000; // how often to re-fetch cases/students/teachers
  var pollTimer = null;
  var viewerName = "";

  var root = document.getElementById("app");
  var overlayLayer = document.getElementById("overlayLayer");

  // ---------------------------------------------------------------
  // Utilities
  // ---------------------------------------------------------------
  function esc(s) {
    if (s === undefined || s === null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function uid(prefix) {
    return (prefix || "c") + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }) +
        " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }

  function fmtDateOnly(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso + (iso.length === 10 ? "T00:00:00" : ""));
      return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
    } catch (e) { return iso; }
  }

  function showToast(msg) {
    state.toast = msg;
    render();
    setTimeout(function () {
      state.toast = null;
      render();
    }, 2600);
  }

  function classLabel(c) {
    if (!c) return "—";
    if (c.grade === "other") return c.customClass || "—";
    return "Grade " + c.grade + " · " + c.section;
  }

  function findClassTeacher(grade, section) {
    if (!grade || !section) return null;
    for (var i = 0; i < state.teachers.length; i++) {
      var t = state.teachers[i];
      if (t.classTeacherGrade === grade && t.classTeacherSection === section) return t;
    }
    return null;
  }

  // "6-Jinnah", "6-Iqbal", ... one room option per grade+section combo,
  // for the Room / hall dropdown.
  function allRoomOptions() {
    var rooms = [];
    Object.keys(SECTIONS_BY_GRADE).forEach(function (g) {
      if (g === "other") return;
      (SECTIONS_BY_GRADE[g] || []).forEach(function (s) {
        rooms.push(g + "-" + s);
      });
    });
    return rooms;
  }

  function studentsForGradeSection(grade, section) {
    return state.students.filter(function (s) {
      return s.grade === grade && (grade === "other" || s.section === section);
    }).sort(function (a, b) {
      var an = parseInt(a.rollNo, 10), bn = parseInt(b.rollNo, 10);
      if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
      return (a.name || "").localeCompare(b.name || "");
    });
  }

  // ---------------------------------------------------------------
  // Capability init
  // ---------------------------------------------------------------
  // ---------------------------------------------------------------
  // Data layer — talks to the Next.js API routes under API_BASE,
  // which read/write Supabase. Replaces the Claude-artifact-only
  // window.claude db/assets/downloads/user capabilities.
  // ---------------------------------------------------------------

  // Row shape from Postgres is snake_case; the rest of this file was
  // written against camelCase fields, so map on the way in.
  function rowToCase(row) {
    return {
      _id: row.id,
      caseCode: row.case_code,
      studentId: row.student_id,
      studentName: row.student_name,
      rollNo: row.roll_no,
      grade: row.grade,
      section: row.section,
      customClass: row.custom_class,
      subject: row.subject,
      examDate: row.exam_date,
      room: row.room,
      reporterId: row.reporter_id,
      invigilatorName: row.invigilator_name,
      description: row.description,
      offenseTypes: row.offense_types || [],
      offenseOther: row.offense_other,
      invigilatorAction: row.invigilator_action,
      status: row.status,
      reportedAt: row.reported_at,
      studentPhotoIds: row.student_photo_urls || [],
      paperPhotoIds: row.paper_photo_urls || [],
      materialPhotoIds: row.material_photo_urls || [],
      notes: row.notes || [],
      forwarded: row.forwarded,
      recommendation: row.recommendation,
      decision: row.decision,
      closedAt: row.closed_at
    };
  }
  function rowToStudent(row) {
    return {
      _id: row.id, name: row.name, rollNo: row.roll_no, grade: row.grade,
      section: row.section, customClass: row.custom_class, createdAt: row.created_at
    };
  }
  function rowToTeacher(row) {
    return {
      _id: row.id, name: row.name, role: row.role,
      classTeacherGrade: row.class_teacher_grade, classTeacherSection: row.class_teacher_section,
      createdAt: row.created_at
    };
  }

  async function apiGet(path) {
    var res = await fetch(API_BASE + path, {
      cache: "no-store",
      headers: authToken ? { Authorization: "Bearer " + authToken } : {}
    });
    if (res.status === 401) { logout(); throw new Error("Session expired. Please log in again."); }
    if (!res.ok) throw new Error("GET " + path + " failed (" + res.status + ")");
    return res.json();
  }
  async function apiSend(method, path, body) {
    var headers = { "Content-Type": "application/json" };
    if (authToken) headers.Authorization = "Bearer " + authToken;
    var res = await fetch(API_BASE + path, {
      method: method,
      headers: headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (res.status === 401) { logout(); throw new Error("Session expired. Please log in again."); }
    if (!res.ok) {
      var msg = "Request failed (" + res.status + ")";
      try { var j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    return res.json();
  }

  async function login(password) {
    var res = await fetch(API_BASE + "/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password })
    });
    if (!res.ok) {
      var msg = "Incorrect password.";
      try { var j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    var data = await res.json();
    authToken = data.token;
    authRole = data.role;
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ token: authToken, role: authRole }));
    return data;
  }

  function logout() {
    authToken = null;
    authRole = null;
    localStorage.removeItem(AUTH_STORAGE_KEY);
    if (pollTimer) clearInterval(pollTimer);
    render();
  }

  async function loadCases() {
    var data = await apiGet("/cases");
    state.cases = (data.cases || []).map(rowToCase);
    render();
  }
  async function loadStudents() {
    var data = await apiGet("/students");
    state.students = (data.students || []).map(rowToStudent);
    render();
  }
  async function loadTeachers() {
    var data = await apiGet("/teachers");
    state.teachers = (data.teachers || []).map(rowToTeacher);
    render();
  }
  async function loadAll() {
    var results = await Promise.allSettled([loadCases(), loadStudents(), loadTeachers()]);
    results.forEach(function (r) { if (r.status === "rejected") console.error(r.reason); });
  }

  async function initCapabilities() {
    if (!authToken) { render(); return; } // login screen shows instead
    state.dbAvailable = true;
    try {
      await loadAll();
    } catch (e) {
      console.error(e);
      state.dbAvailable = false;
    }
    render();

    // Poll for changes so multiple staff members filing/reviewing cases
    // at the same time see each other's updates without a manual refresh.
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      loadAll().catch(function (e) { console.error(e); });
    }, POLL_MS);
  }

  // ---------------------------------------------------------------
  // Case write helpers
  // ---------------------------------------------------------------
  function getCase(id) {
    for (var i = 0; i < state.cases.length; i++) {
      if (state.cases[i]._id === id) return state.cases[i];
    }
    return null;
  }

  async function createCase(payload) {
    var body = Object.assign({}, payload, {
      studentPhotoUrls: draftEvidence.student.map(function (e) { return e.url; }),
      paperPhotoUrls: draftEvidence.paper.map(function (e) { return e.url; }),
      materialPhotoUrls: draftEvidence.material.map(function (e) { return e.url; })
    });
    try {
      var res = await apiSend("POST", "/cases", body);
      var created = rowToCase(res.case);
      state.cases.unshift(created);
      state.selectedId = created._id;
      state.drawerOpen = false;
      state.mobileDetailOpen = true;
      draftEvidence = { student: [], paper: [], material: [] };
      showToast("Report filed as " + created.caseCode + ".");
      render();
    } catch (e) {
      console.error(e);
      showToast("Could not save the report. Please try again.");
    }
  }

  async function patchCase(caseId, patch) {
    var res = await apiSend("PATCH", "/cases/" + caseId, patch);
    var updated = rowToCase(res.case);
    state.cases = state.cases.map(function (c) { return c._id === caseId ? updated : c; });
    return updated;
  }

  async function addNote(caseId, text, tag) {
    var c = getCase(caseId);
    if (!c) return;
    var notes = (c.notes || []).slice();
    notes.push({ text: text, author: state.myName || "Staff member", tag: tag || "note", at: new Date().toISOString() });
    try { await patchCase(caseId, { notes: notes }); render(); }
    catch (e) { console.error(e); showToast("Could not add the note."); }
  }

  var AUTHOR_BY_STATUS = {
    reported: function (c) { return state.myName || c.invigilatorName || "Invigilator"; },
    controller_review: function () { return CONTROLLER_NAME; },
    coordinator_review: function (c) { return classCoordinatorFor(c.grade); },
    principal_review: function () { return "Principal"; }
  };

  // Moves a case one step along the fixed review chain (see CASE_CHAIN),
  // logging whatever note was entered under the outgoing stage's tag.
  async function advanceCase(caseId, noteText, decisionFields) {
    var c = getCase(caseId);
    var step = c && CASE_CHAIN[c.status];
    if (!c || !step) return;
    var patch = { status: step.next };
    if (step.isDecision) {
      patch.decision = decisionFields;
    } else {
      var notes = (c.notes || []).slice();
      if (noteText) {
        var authorFn = AUTHOR_BY_STATUS[c.status];
        notes.push({ text: noteText, author: authorFn ? authorFn(c) : (state.myName || "Staff"), tag: step.tag, at: new Date().toISOString() });
      }
      patch.notes = notes;
    }
    if (step.setsClosedAt) patch.closedAt = new Date().toISOString();
    try {
      await patchCase(caseId, patch);
      state.openAction = null;
      state.openActionId = null;
      showToast("Case moved to " + (STATUS_LABEL[step.next] || step.next) + ".");
      render();
    } catch (e) { console.error(e); showToast(e.message || "Could not update the case."); }
  }

  async function reopenCase(caseId) {
    try {
      await patchCase(caseId, { status: "senior_review" });
      await addNote(caseId, "Case reopened for further review.", "reopen");
      showToast("Case reopened.");
      render();
    } catch (e) { console.error(e); }
  }

  async function uploadFile(file, category) {
    var form = new FormData();
    form.append("file", file);
    form.append("category", category);
    var headers = authToken ? { Authorization: "Bearer " + authToken } : {};
    var res = await fetch(API_BASE + "/upload", { method: "POST", headers: headers, body: form });
    if (res.status === 401) { logout(); throw new Error("Session expired. Please log in again."); }
    if (!res.ok) {
      var msg = "Upload failed (" + res.status + ")";
      try { var j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    return res.json(); // { url, path }
  }

  // Upload evidence to an EXISTING case (used from the detail page).
  async function uploadCaseEvidence(caseId, file, category) {
    var c = getCase(caseId);
    if (!c) return;
    var field = category === "student" ? "studentPhotoIds" : category === "paper" ? "paperPhotoIds" : "materialPhotoIds";
    var apiField = category === "student" ? "studentPhotoUrls" : category === "paper" ? "paperPhotoUrls" : "materialPhotoUrls";
    state.uploading = true;
    render();
    try {
      var uploaded = await uploadFile(file, category);
      var urls = (c[field] || []).slice();
      urls.push(uploaded.url);
      var patch = {}; patch[apiField] = urls;
      await patchCase(caseId, patch);
      showToast("Evidence attached.");
    } catch (e) { console.error(e); showToast(e && e.message ? e.message : "Could not upload evidence."); }
    finally { state.uploading = false; render(); }
  }

  // Upload evidence to the DRAFT (before the case exists) — targeted DOM
  // update only, no render(), so the rest of the open form is untouched.
  async function uploadDraftEvidence(file, category) {
    var containerId = "draft_" + category + "_thumbs";
    var container = document.getElementById(containerId);
    try {
      var res = await uploadFile(file, category);
      draftEvidence[category].push({ url: res.url, path: res.path });
      if (container) {
        var span = document.createElement("span");
        span.style.position = "relative";
        span.style.display = "inline-block";
        span.innerHTML =
          '<img class="evidence-thumb" src="' + esc(res.url) + '" alt="' + esc(category) + ' photo">' +
          '<button type="button" data-action="remove-draft-evidence" data-cat="' + category + '" data-id="' + esc(res.url) + '" ' +
          'style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#B23A5B;color:#fff;border:2px solid #fff;font-size:12px;line-height:1;cursor:pointer;">×</button>';
        container.insertBefore(span, container.lastElementChild);
      }
    } catch (e) { console.error(e); showToast(e && e.message ? e.message : "Could not upload evidence."); }
  }

  function removeDraftEvidence(category, url, btnEl) {
    var removed = null;
    draftEvidence[category] = draftEvidence[category].filter(function (x) {
      if (x.url === url) { removed = x; return false; }
      return true;
    });
    if (btnEl && btnEl.parentElement) btnEl.parentElement.remove();
    if (removed && removed.path) {
      apiSend("DELETE", "/upload", { path: removed.path }).catch(function () {});
    }
  }

  function exportCsv() {
    var rows = [[
      "Case code", "Student", "Roll No", "Class", "Subject", "Exam date", "Room",
      "Reported by", "Reported at", "Offense types", "Invigilator recommended action",
      "Status", "Decision", "Decided by"
    ]];
    filteredCases().forEach(function (c) {
      rows.push([
        c.caseCode, c.studentName, c.rollNo, classLabel(c), c.subject, c.examDate, c.room,
        c.invigilatorName, fmtDate(c.reportedAt),
        (c.offenseTypes || []).join("; "), c.invigilatorAction || "",
        STATUS_LABEL[c.status] || c.status,
        c.decision ? ((c.decision.action ? c.decision.action + " — " : "") + c.decision.text) : "",
        c.decision ? c.decision.decidedBy : ""
      ]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) {
        var s = (v === undefined || v === null) ? "" : String(v);
        if (s.indexOf(",") > -1 || s.indexOf('"') > -1 || s.indexOf("\n") > -1) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      }).join(",");
    }).join("\n");

    var blob = new Blob([csv], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "umc-cases.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function bulkImportStudents(text) {
    var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) { showToast("Nothing to import."); return; }
    var bulk = [];
    for (var i = 0; i < lines.length; i++) {
      var parts = lines[i].split(",").map(function (p) { return p.trim(); });
      var name = parts[0], rollNo = parts[1] || "", grade = parts[2] || "6", section = parts[3] || "";
      if (!name) continue;
      bulk.push({ name: name, rollNo: rollNo, grade: grade, section: section });
    }
    try {
      var res = await apiSend("POST", "/students", { bulk: bulk });
      showToast("Imported " + res.inserted + " student" + (res.inserted === 1 ? "" : "s") + (res.failed ? (", " + res.failed + " failed") : ".") + ".");
      await loadStudents();
    } catch (e) {
      console.error(e);
      showToast("Import failed.");
    }
    state.rosterImportOpen = false;
    render();
  }

  async function bulkImportTeachers(text) {
    var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) { showToast("Nothing to import."); return; }
    var bulk = [];
    for (var i = 0; i < lines.length; i++) {
      var parts = lines[i].split(",").map(function (p) { return p.trim(); });
      var name = parts[0], role = parts[1] || "Invigilator", ctGrade = parts[2] || "", ctSection = parts[3] || "";
      if (!name) continue;
      bulk.push({ name: name, role: role, classTeacherGrade: ctGrade, classTeacherSection: ctSection });
    }
    try {
      var res = await apiSend("POST", "/teachers", { bulk: bulk });
      showToast("Imported " + res.inserted + " teacher" + (res.inserted === 1 ? "" : "s") + (res.failed ? (", " + res.failed + " failed") : ".") + ".");
      await loadTeachers();
    } catch (e) {
      console.error(e);
      showToast("Import failed.");
    }
    state.rosterImportOpen = false;
    render();
  }

  // ---------------------------------------------------------------
  // Filtering
  // ---------------------------------------------------------------
  function filteredCases() {
    var q = state.search.trim().toLowerCase();
    return state.cases.filter(function (c) {
      if (state.filterStatus !== "all" && c.status !== state.filterStatus) return false;
      if (state.filterGrade !== "all" && c.grade !== state.filterGrade) return false;
      if (q) {
        var hay = [c.studentName, c.caseCode, c.rollNo, c.subject, c.room, c.invigilatorName].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function tallyCounts() {
    var counts = { reported: 0, controller_review: 0, coordinator_review: 0, senior_review: 0, principal_review: 0, closed: 0 };
    state.cases.forEach(function (c) { if (counts[c.status] !== undefined) counts[c.status]++; });
    return counts;
  }

  function filteredStudents() {
    var q = state.rosterSearch.trim().toLowerCase();
    if (!q) return state.students;
    return state.students.filter(function (s) {
      return (s.name + " " + s.rollNo).toLowerCase().indexOf(q) > -1;
    });
  }

  function filteredTeachers() {
    var q = state.rosterSearch.trim().toLowerCase();
    if (!q) return state.teachers;
    return state.teachers.filter(function (t) {
      return (t.name + " " + (t.role || "")).toLowerCase().indexOf(q) > -1;
    });
  }

  // ---------------------------------------------------------------
  // Top-level render dispatch
  //
  // IMPORTANT: the drawer is deliberately NOT rebuilt on every render().
  // render() fires whenever live data changes (another staff member's
  // edit arrives via the db subscription) — if the drawer's form HTML
  // were regenerated on every such event, a half-filled incident report
  // would be silently wiped out from under the person typing it. So the
  // drawer lives in its own container (#overlayLayer) and syncOverlay()
  // only (re)builds it on the OPEN/CLOSE transition, never while it's
  // already open. Toast and lightbox hold no user input, so they're
  // safe to rebuild freely.
  // ---------------------------------------------------------------
  function renderLoginScreen() {
    return (
      '<div class="login-screen">' +
        '<div class="login-card">' +
          '<div class="brand-eyebrow" style="color:var(--muted); margin-bottom:4px;">Centre of Excellence (B), Sialkot</div>' +
          '<div class="brand-title" style="color:var(--ink); font-size:22px; margin-bottom:18px;">Unfair Means Case Register</div>' +
          '<label style="font-size:13.5px; font-weight:700; color:var(--ink);">Password</label>' +
          '<input id="loginPassword" type="password" placeholder="Enter your staff password" style="width:100%; margin:8px 0 14px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;">' +
          (state.loginError ? '<div style="color:var(--status-reported); font-size:13px; margin-bottom:10px;">' + esc(state.loginError) + "</div>" : "") +
          '<button class="btn btn-gold" id="loginSubmitBtn" style="width:100%; justify-content:center;">Log in</button>' +
          '<div style="font-size:12px; color:var(--muted); margin-top:14px;">Ask your controller / admin for the staff or admin password.</div>' +
        "</div>" +
      "</div>"
    );
  }

  function bindLoginEvents() {
    var btn = document.getElementById("loginSubmitBtn");
    var input = document.getElementById("loginPassword");
    if (!btn || !input) return;
    function attempt() {
      var pw = input.value;
      if (!pw) return;
      btn.disabled = true;
      btn.textContent = "Checking…";
      login(pw).then(function () {
        state.loginError = null;
        initCapabilities();
      }).catch(function (e) {
        state.loginError = e.message || "Incorrect password.";
        btn.disabled = false;
        btn.textContent = "Log in";
        render();
      });
    }
    btn.addEventListener("click", attempt);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
    input.focus();
  }

  function render() {
    if (!authToken) {
      root.innerHTML = renderLoginScreen();
      bindLoginEvents();
      return;
    }

    // Safety net for shorter in-page forms (the note box, the inline
    // forward/recommend/decide fields): if a background data update causes
    // a re-render while the person is mid-type, don't let it vanish under
    // them. (The New Report drawer needs no such patch — it's isolated
    // from this render cycle entirely; see syncOverlay() below.)
    var ae = document.activeElement;
    var preserved = null;
    if (ae && ae.id && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT") && root.contains(ae)) {
      preserved = { id: ae.id, value: ae.value };
      try { preserved.selStart = ae.selectionStart; preserved.selEnd = ae.selectionEnd; } catch (e) {}
    }

    var html = "";
    html += renderTopbar();
    if (state.view === "rosters") {
      html += renderRostersView();
    } else {
      var counts = tallyCounts();
      html += renderTally(counts);
      html += '<div class="main">';
      html += renderRail();
      html += renderDetailPane();
      html += "</div>";
    }
    root.innerHTML = html;
    bindEvents();
    syncOverlay();

    if (preserved) {
      var again = document.getElementById(preserved.id);
      if (again && (again.tagName === "TEXTAREA" || again.tagName === "INPUT")) {
        again.value = preserved.value;
        again.focus();
        if (preserved.selStart !== undefined) {
          try { again.setSelectionRange(preserved.selStart, preserved.selEnd); } catch (e) {}
        }
      }
    }
  }

  var drawerMounted = false;
  var letterMounted = false;
  var cameraMounted = false;

  function syncOverlay() {
    // --- Camera: real getUserMedia stream, must not be torn down or
    // re-requested by an unrelated re-render while it's live. ---
    if (state.cameraOpen && !cameraMounted) {
      var camwrap = document.createElement("div");
      camwrap.id = "cameraHost";
      camwrap.innerHTML = renderCameraModal();
      overlayLayer.appendChild(camwrap);
      cameraMounted = true;
      startCameraStream();
    } else if (!state.cameraOpen && cameraMounted) {
      stopCameraStream();
      var camhost = document.getElementById("cameraHost");
      if (camhost) camhost.remove();
      cameraMounted = false;
    }

    // --- Drawer: mount once on open, unmount once on close, untouched between ---
    if (state.drawerOpen && !drawerMounted) {
      var wrap = document.createElement("div");
      wrap.id = "drawerHost";
      wrap.innerHTML = renderDrawer();
      overlayLayer.appendChild(wrap);
      drawerMounted = true;
      bindDrawerEvents();
      populateDrawerDynamic();
    } else if (!state.drawerOpen && drawerMounted) {
      var host = document.getElementById("drawerHost");
      if (host) host.remove();
      drawerMounted = false;
    }

    // --- Letter modal: same treatment — an in-flight html2canvas capture
    // must never have its source node yanked out from under it by an
    // unrelated background update arriving mid-export. ---
    if (state.letterView && !letterMounted) {
      var lwrap = document.createElement("div");
      lwrap.id = "letterHost";
      lwrap.innerHTML = renderLetterModal();
      overlayLayer.appendChild(lwrap);
      letterMounted = true;
      bindLetterEvents();
    } else if (!state.letterView && letterMounted) {
      var lhost = document.getElementById("letterHost");
      if (lhost) lhost.remove();
      letterMounted = false;
      if (letterResizeHandler) {
        window.removeEventListener("resize", letterResizeHandler);
        window.removeEventListener("orientationchange", letterResizeHandler);
        letterResizeHandler = null;
      }
    }

    // --- Lightbox + toast: no persistent input, safe to rebuild freely ---
    var extra = document.getElementById("overlayExtras");
    if (extra) extra.remove();
    var extraHtml = "";
    if (state.lightboxUrl) extraHtml += renderLightbox();
    if (state.toast) extraHtml += '<div class="toast">' + esc(state.toast) + "</div>";
    if (extraHtml) {
      var extraWrap = document.createElement("div");
      extraWrap.id = "overlayExtras";
      extraWrap.innerHTML = extraHtml;
      overlayLayer.appendChild(extraWrap);
    }
  }

  function renderCameraModal() {
    return (
      '<div class="camera-modal">' +
        '<button type="button" class="camera-cancel-btn" data-action="camera-cancel" aria-label="Close camera">&times;</button>' +
        '<video id="cameraVideo" autoplay playsinline muted></video>' +
        '<canvas id="cameraCanvas" style="display:none;"></canvas>' +
        '<div id="cameraErrorBox"></div>' +
        '<div class="camera-controls"><button type="button" class="camera-shutter-btn" data-action="camera-shutter" aria-label="Take photo"></button></div>' +
      "</div>"
    );
  }

  async function startCameraStream() {
    var video = document.getElementById("cameraVideo");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCameraError("This browser can't access the camera directly. Please use the upload button instead.");
      return;
    }
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      if (video) video.srcObject = cameraStream;
    } catch (e) {
      console.error(e);
      showCameraError("Could not open the camera. Check that this site has camera permission (in your browser's site settings), then try again.");
    }
  }

  function showCameraError(message) {
    var box = document.getElementById("cameraErrorBox");
    if (box) box.innerHTML = '<div class="camera-error">' + esc(message) + '<br><br><button type="button" class="btn btn-outline" data-action="camera-cancel">Close</button></div>';
    var video = document.getElementById("cameraVideo");
    if (video) video.style.display = "none";
    var shutter = document.querySelector(".camera-shutter-btn");
    if (shutter) shutter.style.display = "none";
  }

  function stopCameraStream() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(function (t) { t.stop(); });
      cameraStream = null;
    }
  }

  function openCamera(category, caseId) {
    cameraTargetCategory = category;
    cameraTargetCaseId = caseId || null;
    state.cameraOpen = true;
    render();
  }

  function closeCamera() {
    state.cameraOpen = false;
    cameraTargetCategory = null;
    cameraTargetCaseId = null;
    render();
  }

  function capturePhotoFromCamera() {
    var video = document.getElementById("cameraVideo");
    var canvas = document.getElementById("cameraCanvas");
    if (!video || !canvas || !video.videoWidth) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var file = new File([blob], "photo-" + Date.now() + ".jpg", { type: "image/jpeg" });
      var category = cameraTargetCategory;
      var caseId = cameraTargetCaseId;
      closeCamera();
      if (caseId) {
        uploadCaseEvidence(caseId, file, category);
      } else {
        uploadDraftEvidence(file, category);
      }
    }, "image/jpeg", 0.9);
  }

    }

      var html = '<div class="evidence-category"><div class="evidence-category-title">' + esc(title) + "</div>";
      html += '<div class="evidence-grid">';
      (ids || []).forEach(function (id) {
        html += '<img class="evidence-thumb" src="' + esc(id) + '" data-action="view-evidence" data-url="' + esc(id) + '" alt="' + esc(title) + '">';

        html += '<button type="button" class="evidence-upload-btn" title="Take a photo" data-action="open-camera" data-category="' + category + '" data-case-target="1">📷</button>';
        html += '<label class="evidence-upload-btn" title="Upload from gallery">⬆' +
          '<input type="file" accept="image/*" class="case-evidence-input" data-category="' + category + '" style="display:none;">' +
          "</label>";

      html += "</div></div>";
      return html;
    }

    var classTeacher = findClassTeacher(c.grade, c.section);

    var html = '<div class="detail-pane' + detailHidden + '">';
    html += '<a class="back-link" data-action="back-to-list" href="javascript:void(0)">‹ Back to list</a>';

    html += '<div class="file-header"><div>';
    html += '<span class="file-code">' + esc(c.caseCode) + "</span>";
    html += '<h1 class="file-title">' + esc(c.studentName || "Unnamed student") + "</h1>";
    html += '<div class="file-subtitle">' + esc(classLabel(c)) + " · Roll No. " + esc(c.rollNo || "—") + "</div>";
    if (classTeacher) html += '<div class="class-teacher-note">Class teacher: ' + esc(classTeacher.name) + "</div>";
    html += "</div>" + statusTag(c.status) + "</div>";

    html += '<div class="file-grid">';
    html += field("Subject", c.subject);
    html += field("Exam date", fmtDateOnly(c.examDate));
    html += field("Room / hall", c.room);
    html += field("Reported by", c.invigilatorName);
    html += field("Reported on", fmtDate(c.reportedAt));
    html += "</div>";

    if ((c.offenseTypes && c.offenseTypes.length) || c.invigilatorAction) {
      html += '<div class="file-grid">';
      if (c.offenseTypes && c.offenseTypes.length) {
        html += field("Offense type(s)", c.offenseTypes.join(", ") + (c.offenseOther ? " — " + c.offenseOther : ""));
      }
      if (c.invigilatorAction) {
        html += field("Invigilator's recommended action", c.invigilatorAction);
      }
      html += "</div>";
    }

    html += '<div class="section-block"><h2 class="section-heading">Incident description</h2>';
    html += '<div class="desc-text">' + esc(c.description || "No description provided.") + "</div></div>";

    html += '<div class="section-block"><h2 class="section-heading">Evidence</h2>';
    html += evidenceCategory("Photo of student", c.studentPhotoIds, "student");
    html += evidenceCategory("Photo of answer script / paper", c.paperPhotoIds, "paper");
    html += evidenceCategory("Photo of unfair-means material", c.materialPhotoIds, "material");
    html += "</div>";

    if (c.decision) {
      html += '<div class="callout" data-kind="decision"><div class="callout-label">Senior Coordinator\'s decision</div>';
      html += '<div class="callout-body">' + (c.decision.action ? "<b>" + esc(c.decision.action) + "</b><br>" : "") + esc(c.decision.text) + "</div>";
      html += '<div class="callout-meta">Decided by ' + esc(c.decision.decidedBy) + " · " + fmtDate(c.decision.at) + "</div></div>";
    }

    html += '<div class="section-block"><h2 class="section-heading">Case notes</h2><div class="timeline">';
    html += timelineItem("Case reported by " + esc(c.invigilatorName || "invigilator") + ".", c.reportedAt);
    (c.notes || []).forEach(function (n) {
      if (n.tag === "senior-decision") return; // shown above as the decision callout
      html += timelineItem(esc(n.author) + ": " + esc(n.text), n.at);
    });
    if (c.decision) html += timelineItem(esc(c.decision.decidedBy) + " recorded the decision and referred the case to the Principal.", c.decision.at);
    if (c.closedAt) html += timelineItem("Case closed by the Principal.", c.closedAt);
    html += "</div>";

    var plainQuickNotes = DEFAULT_NOTES["note"] || [];
    html += '<div class="note-form">' +
      (plainQuickNotes.length ? '<div class="quick-notes">' + plainQuickNotes.map(function (n) { return '<button type="button" class="quick-note-chip" data-action="use-quick-note" data-target="noteInput" data-text="' + esc(n) + '">' + esc(n) + "</button>"; }).join("") + "</div>" : "") +

  function renderActionBar(c) {
    var html = '<div class="action-bar">';

      html += '<button class="btn btn-gold" data-action="open-advance" data-id="' + c._id + '">' + esc(step.buttonLabel(c)) + "</button>";

    if (isAdmin() && c.status === "closed") {
      html += '<button class="btn btn-outline" data-action="reopen-case" data-id="' + c._id + '">Reopen case</button>';
    }
    html += '<button class="btn btn-outline" data-action="open-letter" data-type="initiation" data-id="' + c._id + '">Initiation letter</button>';
    if (c.status === "closed") {
      html += '<button class="btn btn-outline" data-action="open-letter" data-type="closure" data-id="' + c._id + '">Closure letter</button>';
    }
    html += '<button class="btn btn-outline" data-action="print-case" data-id="' + c._id + '">Print case file</button>';
    html += "</div>";

    if (state.openAction === "advance" && state.openActionId === c._id && step) {
      var quickNotes = DEFAULT_NOTES[step.tag] || [];
      var quickHtml = quickNotes.length
        ? '<div class="quick-notes"><div class="quick-notes-label">Quick notes — tap to use, then edit as needed:</div>' +
            quickNotes.map(function (n, i) { return '<button type="button" class="quick-note-chip" data-action="use-quick-note" data-target="' + (step.isDecision ? "decText" : "advanceNote") + '" data-text="' + esc(n) + '">' + esc(n.length > 46 ? n.slice(0, 46) + "…" : n) + "</button>"; }).join("") +
          "</div>"
        : "";

      var fieldsHtml;
      if (step.isDecision) {
        fieldsHtml =
          '<div class="form-field"><label>Decided by</label><input id="decBy" type="text" value="' + esc(seniorCoordinatorFor(c.grade)) + '"></div>' +
          '<div class="form-field"><label>Proposed action</label><select id="recAction">' + ACTION_OPTIONS.map(function (a) { return '<option value="' + esc(a) + '">' + esc(a) + "</option>"; }).join("") + "</select></div>" +
          '<div class="form-field full">' + quickHtml + '<label>' + esc(step.noteLabel) + ' <span class="required-mark">*</span></label><textarea id="decText" placeholder="Record the reasoning and the decision…"></textarea></div>';
      } else {
        fieldsHtml = '<div class="form-field full">' + quickHtml + '<label>' + esc(step.noteLabel) + '</label><textarea id="advanceNote" placeholder="Add context for the next reviewer…"></textarea></div>';
      }

      html += (
        '<div class="file-grid" style="margin-top:14px; display:block;"><div class="form-grid">' + fieldsHtml + "</div>" +
          '<div style="margin-top:14px; display:flex; gap:8px;">' +
            '<button class="btn btn-gold btn-small" data-action="submit-advance" data-id="' + c._id + '">' + esc(step.buttonLabel(c)) + "</button>" +
            '<button class="btn btn-outline btn-small" data-action="cancel-inline">Cancel</button>' +
          "</div></div>"
      );
    }
    return html;
  }

  function fmtLongDate(iso) {
    if (!iso) return "____________";
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
    } catch (e) { return iso; }
  }

  // On phones (and any window narrower than the fixed 794px A4 page),
  // shrink the letter to fit on screen. IMPORTANT: the scale transform is
  // applied to a WRAPPER (#letterScaleInner), never to #letterCapture
  // itself — html2canvas measures the element it's given directly, so if
  // the transform sat on #letterCapture, a capture triggered from a phone
  // could come back at the shrunk on-screen size instead of full 794x1123
  // resolution. Scaling a wrapper keeps #letterCapture untouched at all
  // times; only its on-screen presentation changes.
  function fitLetterToViewport() {
    var inner = document.getElementById("letterScaleInner");
    var wrap = document.getElementById("letterScaleWrap");
    if (!inner || !wrap) return;
    var available = window.innerWidth - 32; // side padding on .letter-modal-overlay
    var scale = Math.min(1, available / 794);
    inner.style.transform = scale < 1 ? "scale(" + scale + ")" : "";
    inner.style.transformOrigin = "top left";
    wrap.style.width = (794 * scale) + "px";
    wrap.style.height = (1123 * scale) + "px";
  }

  var letterResizeHandler = null;

  var letterCapturing = false;

  async function captureLetterCanvas() {
    var node = document.getElementById("letterCapture");
    if (!node) return null;
    if (typeof window.html2canvas !== "function") {
      showToast("Letter export isn't available right now — the rendering library didn't load. Check your connection and reopen the letter.");
      return null;
    }
    var targetWidth = 3840; // 4K
    var scale = targetWidth / node.offsetWidth;
    return await window.html2canvas(node, {
      scale: scale,
      backgroundColor: "#ffffff",
      useCORS: true
    });
  }

  async function downloadLetterPng(caseCode, kind) {
    if (letterCapturing) return;
    letterCapturing = true;
    try {
      var canvas = await captureLetterCanvas();
      if (!canvas) return;
      canvas.toBlob(async function (blob) {
        if (!blob) { showToast("Could not generate the image."); return; }
        var filename = caseCode + "-" + kind + "-letter.png";
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, "image/png");
    } catch (e) {
      console.error(e); showToast("Could not generate the letter image.");
    } finally {
      letterCapturing = false;
    }
  }

  async function downloadLetterPdf(caseCode, kind) {
    if (letterCapturing) return;
    letterCapturing = true;
    try {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        showToast("PDF export isn't available right now — the rendering library didn't load. Check your connection and reopen the letter.");
        return;
      }
      var canvas = await captureLetterCanvas();
      if (!canvas) return;
      var pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
      var pageWidth = pdf.internal.pageSize.getWidth();
      var pageHeight = pdf.internal.pageSize.getHeight();
      var imgData = canvas.toDataURL("image/png");
      pdf.addImage(imgData, "PNG", 0, 0, pageWidth, pageHeight);
      var blob = pdf.output("blob");
      var filename = caseCode + "-" + kind + "-letter.pdf";
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      console.error(e); showToast("Could not generate the PDF.");
    } finally {
      letterCapturing = false;
    }
  }
