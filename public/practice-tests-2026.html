<style>
:root{--navy:#150F3F;--gold:#F3B129;--green:#009846;--bg:#f5f4fa}
*{box-sizing:border-box}
body{overflow-x:clip;margin:0;font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#15142E;font-size:17px}
.hub-top{max-width:1180px;margin:0 auto 8px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
main{max-width:1180px;margin:0 auto;padding:0 24px 64px}
main h2{color:var(--navy);margin:40px 0 14px;font-size:clamp(26px,3vw,36px);padding-bottom:12px;background:linear-gradient(var(--navy),var(--navy)) left bottom/100% 3px no-repeat,linear-gradient(var(--gold),var(--gold)) left calc(100% - 5px)/100% 3px no-repeat}
a.test{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #dcdaea;border-radius:12px;padding:16px 18px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(21,15,63,.08);transition:transform .12s,box-shadow .12s}
a.test:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(21,15,63,.15)}
a.test b{display:block;color:var(--navy);font-size:17px}
a.test span{font-size:13px;color:#5b5a70}
a.test i{font-style:normal;background:var(--green);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.grp{background:#fff;border:1px solid #dcdaea;border-radius:12px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(21,15,63,.08)}
.grp>div>b{display:block;color:var(--navy);font-size:17px}.grp>div>span{font-size:13px;color:#5b5a70}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:96px;padding:8px 12px;border-radius:10px;text-decoration:none;border:1.5px solid}
.chip b{font-size:14px}.chip small{font-size:11px;margin-top:2px}
.chip.live{background:var(--green);color:#fff;border-color:var(--green)}
.chip.soon{background:#FFF6DC;color:#8a5a00;border-color:#B7791F}
.chip.off{background:#f1f0f6;color:#8a89a0;border-color:#dcdaea}
.chip.live:hover{filter:brightness(1.1)}
.bar{position:sticky;top:var(--sc-h);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid #dcdaea}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pill{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 16px;font:600 14px system-ui,sans-serif;cursor:pointer}
.pill.sm{padding:5px 12px;font-size:13px;border-color:#b9b6d3}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tools input[type=search]{flex:1;min-width:180px;padding:10px 12px;border:1.5px solid #cfcce3;border-radius:10px;font-size:15px}
.lv{font-size:14px;color:var(--navy);white-space:nowrap}
.empty{text-align:center;color:#5b5a70;padding:30px 0}
.hdr-logos{display:flex;gap:12px;flex-wrap:wrap}
.hdr-logos img{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(21,15,63,.18)}
@media (max-width:480px){.hdr-logos{gap:10px}.hdr-logos img{width:60px;height:60px}}
.wm{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wm img{width:min(75vw,560px);height:auto;opacity:.06}
.wm-practice{position:fixed;inset:0;z-index:21;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wm-practice span{transform:rotate(-32deg);font:900 clamp(60px,18vw,230px)/1 system-ui,Arial,sans-serif;letter-spacing:.06em;color:#009846;opacity:.09;white-space:nowrap}
.gate{position:fixed;inset:0;z-index:500;background:rgba(21,15,63,.72);display:none;align-items:center;justify-content:center;padding:16px}
.gate.on{display:flex}
.gate .box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px 24px;text-align:center;border-top:6px solid #F3B129;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gate-logos{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.gate-logos img{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(21,15,63,.2);border:1px solid #ecebf4}
@media (max-width:380px){.gate-logos img{width:54px;height:54px}}
.gate h3{margin:12px 0 6px;color:#150F3F;font-size:20px}
.gate p{margin:0 0 16px;color:#4a4866;font-size:14.5px}
.gate input{width:100%;padding:13px 14px;font-size:20px;text-align:center;letter-spacing:.12em;border:2px solid #cfcce3;border-radius:10px}
.gate input:focus{outline:none;border-color:#150F3F}
.gate .err{color:#B3202A;font-weight:600;font-size:14px;min-height:20px;margin:8px 0 4px}
.gate .row{display:flex;gap:10px;margin-top:8px}
.gate button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;border:1.5px solid #150F3F}
.gate .go{background:#150F3F;color:#fff}.gate .no{background:#fff;color:#150F3F}
.gate button:disabled{opacity:.5}
/* loading: four logos circling the message */
.loader{position:relative;width:250px;height:250px;margin:36px auto;display:flex;align-items:center;justify-content:center}
.loader p{margin:0;color:#150F3F;font-weight:700;font-size:16px;text-align:center}
.orbit{position:absolute;inset:0;border:2px dashed #cfcce3;border-radius:50%;animation:orbit 6s linear infinite}
.orbit img{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(21,15,63,.22)}
.orbit img:nth-child(1){transform:rotate(0deg) translateY(-125px) rotate(0deg);animation:up1 6s linear infinite}
.orbit img:nth-child(2){animation:up2 6s linear infinite}
.orbit img:nth-child(3){animation:up3 6s linear infinite}
.orbit img:nth-child(4){animation:up4 6s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
/* each logo sits at its place on the ring and turns back so it always stays upright */
@keyframes up1{from{transform:rotate(0deg) translateY(-125px) rotate(0deg)}to{transform:rotate(0deg) translateY(-125px) rotate(-360deg)}}
@keyframes up2{from{transform:rotate(90deg) translateY(-125px) rotate(-90deg)}to{transform:rotate(90deg) translateY(-125px) rotate(-450deg)}}
@keyframes up3{from{transform:rotate(180deg) translateY(-125px) rotate(-180deg)}to{transform:rotate(180deg) translateY(-125px) rotate(-540deg)}}
@keyframes up4{from{transform:rotate(270deg) translateY(-125px) rotate(-270deg)}to{transform:rotate(270deg) translateY(-125px) rotate(-630deg)}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit img{animation:none}
  .orbit img:nth-child(2){transform:rotate(90deg) translateY(-125px) rotate(-90deg)}.orbit img:nth-child(3){transform:rotate(180deg) translateY(-125px) rotate(-180deg)}.orbit img:nth-child(4){transform:rotate(270deg) translateY(-125px) rotate(-270deg)}}
.hub-foot{text-align:center;font-size:15px;color:#5b5a70;padding:0 16px 40px;margin:0}
html.locked .gate{background:#150F3F}

<script>
(function(){
var MONTH="October 2026";
var BUILTIN=[{slug:"oct-2026-class-8-geography-ch3",classNum:8,subject:"Geography",chapter:"Chapter 3",
  sub:"Environmental Pollution · 52 timed MCQs · camera required",url:"/online-tests-2026/class-8-geography-ch3.html"}];
function ord(n){return n+(n===11||n===12||n===13?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"));}
function fmt(iso){try{return new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});}catch(e){return "";}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
var ORD={1:"1st",2:"2nd",3:"3rd",4:"4th",5:"5th"};
var PRACTICE=/practice/.test(location.pathname);
var PRACTICE_ALIAS={"oct-2026-class-8-geography-ch3":"online-tests-2026-class-8-geography-chapter-3"};
var F={cls:0,subj:"all",live:false,q:""};
try{var sv=JSON.parse(sessionStorage.getItem(PRACTICE?"hubFp":"hubF")||"null");if(sv)F=sv;}catch(e){}
if(PRACTICE)F.live=false;
try{var qc=+new URLSearchParams(location.search).get("class");if(qc>=1&&qc<=12){F.cls=qc;F.subj="all";}}catch(e){}
function saveF(){try{sessionStorage.setItem(PRACTICE?"hubFp":"hubF",JSON.stringify(F));}catch(e){}}
function render(items,closed){
  var main=document.querySelector("main");main.innerHTML="";
  var classes=[];items.forEach(function(t){if(classes.indexOf(t.classNum)<0)classes.push(t.classNum);});
  classes.sort(function(a,b){return a-b;});
  var isLive=function(t){return (closed[t.slug]||{state:"live"}).state==="live";};
  // ---- filter bar: class, subject, search, live only
  var bar=el("div","bar");
  var row=el("div","pills");
  [0].concat(classes).forEach(function(c){
    var b=el("button","pill"+(F.cls===c?" on":""),c?"Class "+ord(c):"All classes");b.type="button";
    b.onclick=function(){F.cls=c;F.subj="all";saveF();render(items,closed);};row.appendChild(b);
  });
  bar.appendChild(row);
  var subs=[];items.forEach(function(t){if((!F.cls||t.classNum===F.cls)&&subs.indexOf(t.subject)<0)subs.push(t.subject);});subs.sort();
  if(F.subj!=="all"&&subs.indexOf(F.subj)<0)F.subj="all";
  var row2=el("div","pills");
  ["all"].concat(subs).forEach(function(sj){
    var b=el("button","pill sm"+(F.subj===sj?" on":""),sj==="all"?"All subjects":sj);b.type="button";
    b.onclick=function(){F.subj=sj;saveF();render(items,closed);};row2.appendChild(b);
  });
  bar.appendChild(row2);
  var row3=el("div","tools");
  var inp=el("input");inp.type="search";inp.placeholder="Search a chapter…";inp.value=F.q||"";inp.setAttribute("dir","auto");
  inp.oninput=function(){F.q=inp.value;saveF();draw();};
  var lab=el("label","lv");var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!F.live;
  cb.onchange=function(){F.live=cb.checked;saveF();draw();};lab.appendChild(cb);lab.appendChild(document.createTextNode(" Live tests only"));
  row3.appendChild(inp);if(!PRACTICE)row3.appendChild(lab);bar.appendChild(row3);
  main.appendChild(bar);
  var out=el("div");main.appendChild(out);
  function draw(){
    out.innerHTML="";var shown=0;
    classes.forEach(function(c){
      if(F.cls&&F.cls!==c)return;
      var groups=[],gi={};
      items.filter(function(t){return t.classNum===c&&(F.subj==="all"||t.subject===F.subj);}).forEach(function(t){
        var k=t.base||t.slug;
        if(!gi[k]){gi[k]={key:k,subject:t.subject,chapter:t.chapter,sub:t.sub,rounds:{}};groups.push(gi[k]);}
        gi[k].rounds[t.round||1]=t;
      });
      var q=(F.q||"").trim().toLowerCase();
      groups=groups.filter(function(g){
        if(q&&(g.subject+" "+(g.chapter||"")).toLowerCase().indexOf(q)<0)return false;
        if(F.live&&![1,2,3,4,5].some(function(r){return g.rounds[r]&&isLive(g.rounds[r]);}))return false;
        return true;
      });
      if(!groups.length)return;
      out.appendChild(el("h2","","Class "+ord(c)));
      groups.forEach(function(g){
        shown++;
        var card=el("div","grp"),d=el("div");
        var ttl=el("b","",g.subject+(g.chapter?" – "+g.chapter:""));ttl.setAttribute("dir","auto");
        d.appendChild(ttl);
        d.appendChild(el("span","",PRACTICE?String(g.sub||"").replace(/camera required/,"no camera · not saved"):g.sub));card.appendChild(d);
        var chips=el("div","chips");
        if(PRACTICE){
          var pa=el("a","chip live");pa.href="/p/"+(PRACTICE_ALIAS[g.key]||g.key);
          pa.appendChild(el("b","","Practise"));pa.appendChild(el("small","","Open any time"));
          chips.appendChild(pa);card.appendChild(chips);out.appendChild(card);return;
        }
        [1,2,3,4,5].forEach(function(r){
          var t=g.rounds[r];if(!t)return;
          var si=closed[t.slug]||{state:"live"},live=si.state==="live";
          var a=el(live?"a":"span","chip "+(live?"live":si.state==="scheduled"?"soon":"off"));
          if(live)a.href=t.url;
          a.appendChild(el("b","",ORD[r]+" test"));
          a.appendChild(el("small","",live?(si.closesAt?"Closes "+fmt(si.closesAt):"Start now"):(si.state==="scheduled"&&si.opensAt?"Opens "+fmt(si.opensAt):"Closed")));
          chips.appendChild(a);
        });
        card.appendChild(chips);out.appendChild(card);
      });
    });
    if(!shown)out.appendChild(el("p","empty",F.live&&!PRACTICE?"No test is live right now for this choice. Please check again later or ask your teacher.":"No test matches your search."));
  }
  draw();
}
function load(tries){
  fetch("/api/online-test/list",{cache:"no-store"}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"down");return j;});}).then(function(d){
    var old=document.getElementById("dbmsg");if(old)old.remove();
    build(d);
  }).catch(function(){
    var m=document.getElementById("dbmsg");
    if(!m){m=document.createElement("div");m.id="dbmsg";m.style.cssText="margin:14px auto;max-width:720px;padding:12px 16px;border-radius:10px;background:#fff7e6;border:1px solid #f0c36d;color:#7a5200;font:600 14px/1.5 system-ui,sans-serif;text-align:center";document.body.insertBefore(m,document.body.firstChild);}
    m.innerHTML="The test list could not be loaded right now. Please check your internet and <a href='#' style='color:#7a5200' onclick='location.reload();return false'>try again</a>.";
    if(tries<3)setTimeout(function(){load(tries+1);},4000);
  });
}
function build(res0){
  var res=[res0,null],closed={};
  var st=res0.states||{};
  BUILTIN.forEach(function(t){var s=st[t.slug]||{state:"closed",open:false};if(!s.open)closed[t.slug]=s;else if(s.closesAt)closed[t.slug]={state:"live",closesAt:s.closesAt};});
  var items=BUILTIN.slice();
  (res[0].tests||[]).forEach(function(t){
    items.push({slug:t.slug,classNum:t.classNum,subject:t.subject,chapter:t.chapter,url:t.url,round:t.round,base:t.base,
      sub:(t.month&&/\d{4}/.test(t.month)?t.month.match(/\d{4}/)[0]+" · ":"")+t.total+" timed MCQs · "+t.perQ+" seconds each · camera required"});
    if(!t.open)closed[t.slug]={state:t.state||"closed",opensAt:t.opensAt,closesAt:t.closesAt};
    else if(t.closesAt)closed[t.slug]={state:"live",closesAt:t.closesAt};
  });
  function chNo(t){var m=String(t.chapter||"").match(/\d+/);return m?+m[0]:0;}
  items.sort(function(a,b){return a.classNum-b.classNum||String(a.subject).localeCompare(String(b.subject))||chNo(a)-chNo(b);});
  render(items,closed);
}
load(0);
})();
</script>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateT">
  <form class="box" id="gateF" autocomplete="off" novalidate>
    <div class="gate-logos">
      <img src="/ld-naim.webp" alt="Dr Naim Tahir Baig — COE Sialkot (Boys)"><img src="/ld-punjab.webp" alt="Government of the Punjab"><img src="/ld-pectaa.webp" alt="PECTAA"><img src="/ld-daanish.webp" alt="Punjab Daanish Schools &amp; Centres of Excellence Authority">
    </div>
    <h3 id="gateT">Are you a student of COE Sialkot (Boys)?</h3>
    <p>The real Online Tests are only for our students. Write the <b>password</b> given by your teacher.</p>
    <input id="gateRoll" type="password" maxlength="60" placeholder="Password" aria-label="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="err" id="gateErr"></div>
    <div class="row"><button type="button" class="no" id="gateNo">Cancel</button><button type="submit" class="go" id="gateGo">Continue →</button></div>
  </form>
</div>
<script>
(function(){
  var DEST="/online-tests-2026.html",KEY="coeOT",g=document.getElementById("gate"),inp=document.getElementById("gateRoll"),err=document.getElementById("gateErr"),go=document.getElementById("gateGo");
  var ON_HUB=location.pathname.indexOf("/online-tests-2026")===0;
  function passed(){try{return sessionStorage.getItem(KEY)==="1";}catch(e){return false;}}
  function show(){err.textContent="";inp.value="";g.classList.add("on");setTimeout(function(){inp.focus();},50);}
  function close(){if(ON_HUB){location.href="/practice-tests-2026.html";return;}g.classList.remove("on");}
  if(ON_HUB){document.getElementById("gateNo").textContent="Go to Practice";if(!passed()){document.documentElement.classList.add("locked");show();}}
  else document.querySelectorAll('a[href="'+DEST+'"]').forEach(function(a){a.addEventListener("click",function(e){if(passed())return;e.preventDefault();show();});});
  document.getElementById("gateNo").onclick=close;
  if(!ON_HUB){g.addEventListener("click",function(e){if(e.target===g)close();});document.addEventListener("keydown",function(e){if(e.key==="Escape")close();});}
  document.getElementById("gateF").addEventListener("submit",function(e){
    e.preventDefault();var pw=inp.value.trim();
    if(!pw){err.textContent="Write the password.";inp.focus();return;}
    go.disabled=true;go.textContent="Checking…";err.textContent="";
    fetch("/api/online-test/check-student",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){if(!x.ok)throw new Error(x.j.error||"Wrong password");try{sessionStorage.setItem(KEY,"1");}catch(e){}
      if(ON_HUB){g.classList.remove("on");document.documentElement.classList.remove("locked");go.disabled=false;go.textContent="Continue →";}else location.href=DEST;})
    .catch(function(ex){err.textContent=ex.message==="Failed to fetch"?"No internet connection. Please try again.":ex.message;go.disabled=false;go.textContent="Continue →";inp.select();});
  });
})();
</script>
