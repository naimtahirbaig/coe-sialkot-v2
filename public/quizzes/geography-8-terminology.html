<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geography 8 — Terminology Practice | Daanish Schools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #141042;
  --navy-med: #1E1860;
  --navy-light: #2A2480;
  --gold: #E8A820;
  --gold-dark: #C89018;
  --gold-light: #FDF3D8;
  --gold-glow: #E8A82040;
  --bg: #0C0A2E;
  --card: #16123E;
  --card-hover: #1C1850;
  --surface: #201C55;
  --text: #E8E6F4;
  --text-dim: #9994C8;
  --correct: #22C55E;
  --correct-bg: #22C55E18;
  --wrong: #EF4444;
  --wrong-bg: #EF444418;
  --urdu: #C4A0E8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated background */
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 20% 50%, #1a1060 0%, transparent 50%),
              radial-gradient(ellipse at 80% 20%, #2a1848 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, #0a0830 0%, transparent 50%);
  animation: bgShift 20s ease-in-out infinite alternate;
  z-index: -1;
}
@keyframes bgShift {
  0% { transform: translate(0,0) rotate(0deg); }
  100% { transform: translate(-5%,3%) rotate(3deg); }
}

.container { max-width: 900px; margin: 0 auto; padding: 20px; }

/* HEADER */
.header {
  text-align: center;
  padding: 30px 20px 20px;
  position: relative;
}
.header::after {
  content: '';
  display: block;
  width: 120px; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 20px auto 0;
}
.header h1 {
  font-size: 2.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--gold), #FFD700, var(--gold-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.header .sub {
  font-size: 0.95rem;
  color: var(--text-dim);
  margin-top: 6px;
  font-weight: 300;
}
.header .author {
  font-size: 0.8rem;
  color: var(--gold-dark);
  margin-top: 8px;
  font-style: italic;
}
.urdu-title {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: 1.1rem;
  color: var(--urdu);
  direction: rtl;
  margin-top: 4px;
}

/* MODE SELECTION */
.mode-screen { animation: fadeUp 0.5s ease; }
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 30px 0;
}
.mode-card {
  background: var(--card);
  border: 1px solid #2A2680;
  border-radius: 16px;
  padding: 28px 22px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  overflow: hidden;
}
.mode-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), var(--gold-dark));
  transform: scaleX(0);
  transition: transform 0.3s;
}
.mode-card:hover {
  background: var(--card-hover);
  border-color: var(--gold);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(232,168,32,0.12);
}
.mode-card:hover::before { transform: scaleX(1); }
.mode-icon { font-size: 2rem; margin-bottom: 12px; }
.mode-title { font-size: 1.15rem; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
.mode-desc { font-size: 0.82rem; color: var(--text-dim); line-height: 1.5; }

/* CHAPTER SELECTOR */
.chapter-select {
  margin: 20px 0;
}
.chapter-select label {
  font-size: 0.85rem;
  color: var(--text-dim);
  font-weight: 500;
  display: block;
  margin-bottom: 10px;
}
.chapter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid #2A2680;
  background: var(--card);
  color: var(--text-dim);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Outfit', sans-serif;
}
.chip:hover { border-color: var(--gold); color: var(--text); }
.chip.active {
  background: var(--gold);
  color: var(--navy);
  border-color: var(--gold);
  font-weight: 600;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 32px;
  border-radius: 12px;
  border: none;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.25s;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: var(--navy);
}
.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(232,168,32,0.3);
}
.btn-outline {
  background: transparent;
  border: 1px solid #2A2680;
  color: var(--text-dim);
}
.btn-outline:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.btn-sm { padding: 10px 20px; font-size: 0.85rem; border-radius: 10px; }

/* QUIZ SCREEN */
.quiz-screen { animation: fadeUp 0.4s ease; }

.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--surface);
  border-radius: 4px;
  margin: 20px 0 24px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), #FFD700);
  border-radius: 4px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

.quiz-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-size: 0.82rem;
  color: var(--text-dim);
}
.stat-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 8px;
  background: var(--surface);
  font-weight: 500;
}
.stat-badge.correct-stat { color: var(--correct); }
.stat-badge.wrong-stat { color: var(--wrong); }

.question-card {
  background: var(--card);
  border: 1px solid #2A2680;
  border-radius: 20px;
  padding: 32px 28px;
  margin-bottom: 20px;
  position: relative;
}
.q-chapter {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--gold-dark);
  margin-bottom: 12px;
}
.q-number {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.q-text {
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 8px;
}
.q-urdu {
  font-family: 'Noto Nastaliq Urdu', serif;
  direction: rtl;
  text-align: right;
  font-size: 1.05rem;
  color: var(--urdu);
  line-height: 2;
  margin-bottom: 6px;
  padding: 8px 12px;
  background: #1a1550;
  border-radius: 10px;
}
.q-instruction {
  font-size: 0.82rem;
  color: var(--text-dim);
  font-style: italic;
  margin-bottom: 16px;
}

/* MCQ Options */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 14px 18px;
  border: 1px solid #2A2680;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.92rem;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  line-height: 1.5;
}
.option:hover:not(.disabled) {
  border-color: var(--gold);
  background: var(--gold-glow);
}
.option .letter {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.8rem;
  flex-shrink: 0;
  color: var(--gold);
}
.option.correct-option {
  border-color: var(--correct);
  background: var(--correct-bg);
}
.option.correct-option .letter {
  background: var(--correct);
  color: white;
}
.option.wrong-option {
  border-color: var(--wrong);
  background: var(--wrong-bg);
}
.option.wrong-option .letter {
  background: var(--wrong);
  color: white;
}
.option.disabled { cursor: default; opacity: 0.6; }
.option.disabled.correct-option { opacity: 1; }

/* Text input mode */
.text-input-wrap {
  position: relative;
  margin-top: 8px;
}
.text-input {
  width: 100%;
  padding: 14px 18px;
  border: 1px solid #2A2680;
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.text-input:focus { border-color: var(--gold); }
.text-input.correct-input { border-color: var(--correct); background: var(--correct-bg); }
.text-input.wrong-input { border-color: var(--wrong); background: var(--wrong-bg); }

/* Flashcard */
.flashcard-wrap {
  perspective: 1000px;
  margin: 20px 0;
}
.flashcard {
  width: 100%;
  min-height: 280px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute;
  width: 100%; height: 100%;
  backface-visibility: hidden;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 30px;
  text-align: center;
}
.flashcard-front {
  background: linear-gradient(145deg, var(--card), var(--navy-med));
  border: 1px solid #2A2680;
}
.flashcard-back {
  background: linear-gradient(145deg, #1a1555, #120e40);
  border: 1px solid var(--gold-dark);
  transform: rotateY(180deg);
}
.flash-hint {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 16px;
}
.flash-term {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 10px;
}
.flash-urdu-term {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: 1.3rem;
  color: var(--urdu);
  direction: rtl;
}
.flash-def {
  font-size: 1rem;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 12px;
}
.flash-def-urdu {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: 0.95rem;
  direction: rtl;
  color: var(--urdu);
  line-height: 2;
}

.feedback {
  padding: 12px 16px;
  border-radius: 10px;
  margin-top: 12px;
  font-size: 0.88rem;
  font-weight: 500;
  line-height: 1.5;
  animation: fadeUp 0.3s ease;
}
.feedback-correct { background: var(--correct-bg); border: 1px solid #22C55E40; color: var(--correct); }
.feedback-wrong { background: var(--wrong-bg); border: 1px solid #EF444440; color: var(--wrong); }

.action-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

/* RESULTS */
.results-screen { animation: fadeUp 0.5s ease; text-align: center; }
.score-ring {
  width: 180px; height: 180px;
  margin: 30px auto 20px;
  position: relative;
}
.score-ring svg { transform: rotate(-90deg); }
.score-ring .ring-bg { stroke: var(--surface); }
.score-ring .ring-fill {
  stroke: var(--gold);
  stroke-dasharray: 477.5;
  stroke-dashoffset: 477.5;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1);
}
.score-text {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 2.5rem;
  font-weight: 800;
  color: var(--gold);
}
.score-label {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 30px;
}
.result-stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 30px;
}
.result-stat {
  text-align: center;
}
.result-stat .num {
  font-size: 1.8rem;
  font-weight: 700;
}
.result-stat .lbl {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Review list */
.review-list { text-align: left; margin: 20px 0; }
.review-item {
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #2A2680;
  margin-bottom: 8px;
  background: var(--card);
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 0.85rem;
  line-height: 1.5;
}
.review-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }
.review-term { font-weight: 600; color: var(--gold); }
.review-answer { color: var(--text-dim); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* MATCH MODE */
.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
.match-card {
  padding: 14px 16px;
  border: 1px solid #2A2680;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.85rem;
  line-height: 1.5;
  min-height: 60px;
  display: flex;
  align-items: center;
}
.match-card:hover:not(.matched):not(.selected) {
  border-color: var(--gold);
  background: var(--gold-glow);
}
.match-card.selected {
  border-color: var(--gold);
  background: var(--gold-glow);
  box-shadow: 0 0 16px var(--gold-glow);
}
.match-card.matched {
  border-color: var(--correct);
  background: var(--correct-bg);
  opacity: 0.6;
  cursor: default;
}
.match-card.wrong-match {
  animation: shake 0.4s ease;
  border-color: var(--wrong);
  background: var(--wrong-bg);
}
.match-term { font-weight: 600; color: var(--gold); }
.match-def { color: var(--text); font-size: 0.82rem; }

.match-complete{text-align:center;padding:20px;color:var(--correct);font-size:1.1rem;font-weight:600;animation:fadeUp .4s ease}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

@media (max-width: 640px) {
  .mode-grid { grid-template-columns: 1fr; }
  .match-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 1.6rem; }
  .q-text { font-size: 1.05rem; }
  .flash-term { font-size: 1.4rem; }
  .result-stats { gap: 16px; }
}

.brand-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.brand-logo{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 12px var(--gold-glow)}
.brand-text{text-align:center}
.brand-text .org{font-size:.78rem;font-weight:600;color:var(--gold);letter-spacing:.5px}
.brand-text .gov{font-size:.65rem;color:var(--text-dim);font-style:italic}
.author-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid #2A2680;border-radius:16px;padding:16px 20px;margin:16px auto;max-width:620px}
.author-photo{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex-shrink:0;box-shadow:0 4px 16px rgba(232,168,32,.2)}
.author-info{text-align:left}
.author-name{font-size:1.1rem;font-weight:700;color:var(--gold)}
.author-title{font-size:.75rem;color:var(--text-dim);line-height:1.5;margin-top:2px}
.author-contact{font-size:.73rem;color:var(--urdu);margin-top:4px}
.author-contact a{color:var(--urdu);text-decoration:none}
.author-books{font-size:.72rem;color:var(--gold-dark);font-style:italic;margin-top:3px}

</style>
</head>
<body>

<div class="container" id="app"></div>

<script>
// ============================================================
// TERMINOLOGY DATA
// ============================================================
const DATA = [
{ch:"Ch 1: Oceans & Seas",terms:[
{t:"Ocean",u:"سمندر",d:"A huge body of salt water on the Earth's surface.",du:"زمین کی سطح پر کھارے پانی کا ایک بہت بڑا ذخیرہ۔"},
{t:"Sea",u:"بحر",d:"Part of ocean partly enclosed by land, a smaller body on the margins of the ocean.",du:"سمندر کا وہ حصہ جو جزوی طور پر خشکی سے گھرا ہو۔"},
{t:"Pacific Ocean",u:"بحرالکاہل",d:"Largest ocean, area about 166 million sq. km, average depth 4280 metres.",du:"سب سے بڑا سمندر، رقبہ 166 ملین مربع کلومیٹر، اوسط گہرائی 4280 میٹر۔"},
{t:"Atlantic Ocean",u:"بحر اوقیانوس",d:"Second largest ocean, area 82 million sq. km, busiest trade route.",du:"دوسرا سب سے بڑا سمندر، رقبہ 82 ملین مربع کلومیٹر، مصروف ترین تجارتی راستہ۔"},
{t:"Indian Ocean",u:"بحر ہند",d:"Third largest ocean, area 73 million sq. km, average depth 3900 metres.",du:"تیسرا سب سے بڑا سمندر، رقبہ 73 ملین مربع کلومیٹر۔"},
{t:"Antarctic Ocean",u:"بحر منجمد جنوبی",d:"Fourth largest ocean, area 22 million sq. km, average depth 3200 metres.",du:"چوتھا سب سے بڑا سمندر، رقبہ 22 ملین مربع کلومیٹر، اوسط گہرائی 3200 میٹر۔"},
{t:"Arctic Ocean",u:"بحر منجمد شمالی",d:"Smallest ocean around North Pole, area 15 million sq. km, depth 1200 metres.",du:"قطب شمالی کے گرد سب سے چھوٹا سمندر، رقبہ 15 ملین مربع کلومیٹر۔"},
{t:"Peninsula",u:"جزیرہ نما",d:"Land surrounded by water from three sides, connected to mainland by an isthmus.",du:"تین اطراف سے پانی سے گھری خشکی جو ایک تنگ پٹی سے مرکزی زمین سے جڑی ہو۔"},
{t:"Isthmus",u:"خشکی کی تنگ پٹی",d:"Narrow strip of land connecting two large land masses, separating two water bodies.",du:"دو بڑے خشکی کے ٹکڑوں کو جوڑنے والی تنگ پٹی۔"},
{t:"Gulf",u:"خلیج",d:"A large but narrow part of ocean invading farther inland.",du:"سمندر کا بڑا لیکن تنگ حصہ جو خشکی میں دور تک داخل ہو۔"},
{t:"Bay",u:"کھاڑی",d:"Large and vast part of ocean invading farther inland, contrary to gulf.",du:"سمندر کا وسیع حصہ جو خشکی میں دور تک داخل ہو، خلیج کے برعکس۔"},
{t:"Strait",u:"آبنائے",d:"Narrow channel of water connecting two large bodies of water.",du:"پانی کی تنگ گزرگاہ جو دو بڑے آبی ذخائر کو جوڑے۔"},
{t:"Island",u:"جزیرہ",d:"Land surrounded by water from all sides.",du:"چاروں طرف سے پانی سے گھری خشکی۔"},
{t:"Waves",u:"لہریں",d:"Movement of surface water due to winds. Top is crest, bottom is trough.",du:"ہوا سے سطحی پانی کی حرکت۔ اوپر کریسٹ، نیچے ٹرف۔"},
{t:"Currents",u:"سمندری دھارے",d:"Permanent flow of ocean water in a specific direction.",du:"سمندری پانی کا مخصوص سمت میں مستقل بہاؤ۔"},
{t:"Warm Current",u:"گرم دھارا",d:"Currents from equator to polar areas increasing coastal temperature.",du:"خط استوا سے قطبی علاقوں کی طرف بہنے والے دھارے۔"},
{t:"Cold Current",u:"ٹھنڈا دھارا",d:"Currents from polar areas to equator. e.g. Labrador current.",du:"قطبی علاقوں سے خط استوا کی طرف بہنے والے دھارے۔"},
{t:"Tides",u:"جوار بھاٹا",d:"Continuous rise and fall of sea level, twice a day, caused by Moon's gravitation.",du:"سمندر کی سطح میں مسلسل اتار چڑھاؤ، چاند کی کشش ثقل سے۔"},

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function getAllTerms(chIdxs) {
  let terms = [];
  chIdxs.forEach(i => DATA[i].terms.forEach(t => terms.push({...t, ch: DATA[i].ch})));
  return shuffle(terms);
}

  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      const idx = c.dataset.idx;
      if(idx==='all'){
        state.chapters=[0,1,2,3,4,5];
        document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
        c.classList.add('active');
      } else {
        document.querySelector('.chip[data-idx="all"]').classList.remove('active');
        const i = parseInt(idx);
        if(state.chapters.includes(i)) state.chapters=state.chapters.filter(x=>x!==i);
        else state.chapters.push(i);
        if(state.chapters.length===0) state.chapters=[0,1,2,3,4,5];
        document.querySelectorAll('.chip[data-idx]').forEach(x=>{
          if(x.dataset.idx!=='all') x.classList.toggle('active',state.chapters.includes(parseInt(x.dataset.idx)));
        });
        if(state.chapters.length===6) document.querySelector('.chip[data-idx="all"]').classList.add('active');
      }
      const tc=state.chapters.reduce((s,i)=>s+DATA[i].terms.length,0);
      const tci=document.getElementById('termCount');
      if(tci)tci.textContent=tc+' terms selected';
    
      }
    });
  });
}

function startMode(mode) {
  state.mode=mode; state.idx=0; state.score=0; state.wrong=0; state.answers=[];
  state.terms=getAllTerms(state.chapters);
  if(mode==='match'){state.matchStore=getAllTerms(state.chapters);state.matchRound=0;renderMatch();}
  else if(mode==='flash') renderFlash();
  else if(mode==='mcq') renderMCQ();
  else if(mode==='type') renderType();
}

// ---- MCQ ----
function renderMCQ() {
  if(state.idx>=state.terms.length) { renderResults(); return; }
  const term=state.terms[state.idx];
  const others=shuffle(state.terms.filter(t=>t.t!==term.t)).slice(0,3);
  const opts=shuffle([term,...others]);
  const pct=((state.idx)/state.terms.length*100).toFixed(0);
  app.innerHTML=`
  <div class="header"><h1>MCQ Quiz</h1><div class="sub">${term.ch}</div></div>
  <div class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="quiz-stats">
      <span>Q ${state.idx+1} / ${state.terms.length}</span>
      <span><span class="stat-badge correct-stat">✓ ${state.score}</span> <span class="stat-badge wrong-stat">✗ ${state.wrong}</span></span>
    </div>
    <div class="question-card">
      <div class="q-chapter">${term.ch}</div>
      <div class="q-text">What is the definition of <span style="color:var(--gold);font-weight:700">"${term.t}"</span>?</div>
      <div class="q-urdu">${term.u} کی تعریف کیا ہے؟</div>
      <div class="options" id="opts">
        ${opts.map((o,i)=>`<div class="option" data-idx="${i}" data-correct="${o.t===term.t}">
          <span class="letter">${'ABCD'[i]}</span><span>${o.d}</span>
        </div>`).join('')}
      </div>
      <div id="feedback"></div>
    </div>
    <div class="action-row">
      <button class="btn btn-outline btn-sm" onclick="renderHome()">← Home</button>
      <button class="btn btn-gold btn-sm" id="nextBtn" style="display:none" onclick="state.idx++;renderMCQ()">Next →</button>
    </div>
  </div>`;
}

  document.querySelectorAll('.option').forEach(el=>{el.addEventListener('click',()=>checkMCQ(el));});
function checkMCQ(el) { const correct=state.terms[state.idx].t;
  if(el.classList.contains('disabled')) return;
  document.querySelectorAll('.option').forEach(o=>o.classList.add('disabled'));
  const isCorrect = el.dataset.correct==='true';
  if(isCorrect){ el.classList.add('correct-option'); state.score++; }
  else {
    el.classList.add('wrong-option'); state.wrong++;
    document.querySelectorAll('.option').forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct-option'); });
  }
  state.answers.push({term:correct,correct:isCorrect});
  const fb=$('feedback');
  const term=state.terms[state.idx];
  fb.innerHTML=isCorrect
    ?`<div class="feedback feedback-correct">✅ Correct!</div>`
    :`<div class="feedback feedback-wrong">❌ The answer is: <strong>${term.d}</strong><br><span style="font-family:'Noto Nastaliq Urdu';direction:rtl;display:inline-block;margin-top:4px">${term.du}</span></div>`;
  $('nextBtn').style.display='inline-flex';
}

// ---- TYPE ----
function renderType() {
  if(state.idx>=state.terms.length){ renderResults(); return; }
  const term=state.terms[state.idx];
  const pct=((state.idx)/state.terms.length*100).toFixed(0);
  app.innerHTML=`
  <div class="header"><h1>Type the Term</h1><div class="sub">${term.ch}</div></div>
  <div class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="quiz-stats">
      <span>Q ${state.idx+1} / ${state.terms.length}</span>
      <span><span class="stat-badge correct-stat">✓ ${state.score}</span> <span class="stat-badge wrong-stat">✗ ${state.wrong}</span></span>
    </div>
    <div class="question-card">
      <div class="q-chapter">${term.ch}</div>
      <div class="q-instruction">Read the definition below and type the correct term:</div>
      <div class="q-text" style="font-size:1.05rem;font-weight:400;line-height:1.7">${term.d}</div>
      <div class="q-urdu">${term.du}</div>
      <div class="text-input-wrap">
        <input type="text" class="text-input" id="typeInput" placeholder="Type term here..." autocomplete="off" autofocus>
      </div>
      <div id="feedback"></div>
    </div>
    <div class="action-row">
      <button class="btn btn-outline btn-sm" onclick="renderHome()">← Home</button>
      <button class="btn btn-gold btn-sm" id="checkBtn" onclick="checkType()">Check ✓</button>
      <button class="btn btn-gold btn-sm" id="nextBtn" style="display:none" onclick="state.idx++;renderType()">Next →</button>
    </div>
  </div>`;
  $('typeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){if($('nextBtn').style.display!=='none'){state.idx++;renderType();}else checkType();}});
  setTimeout(()=>$('typeInput')?.focus(),100);
}

function checkType(){
  const inp=$('typeInput');
  function _norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'');}
  const val=_norm(inp.value);
  const term=state.terms[state.idx];
  const correct=_norm(term.t);
  const isCorrect=(val===correct)||(val.length>2&&correct.startsWith(val)&&val.length>=correct.length*0.7);
  inp.disabled=true;
  $('checkBtn').style.display='none';
  if(isCorrect){inp.classList.add('correct-input');state.score++;}
  else{inp.classList.add('wrong-input');state.wrong++;}
  state.answers.push({term:term.t,correct:isCorrect});
  $('feedback').innerHTML=isCorrect
    ?`<div class="feedback feedback-correct">✅ Correct! — <strong>${term.t}</strong> (${term.u})</div>`
    :`<div class="feedback feedback-wrong">❌ Correct answer: <strong>${term.t}</strong> (${term.u})</div>`;
  $('nextBtn').style.display='inline-flex';
}

// ---- FLASHCARDS ----
function renderFlash(){
  if(state.idx>=state.terms.length){renderHome();return;}
  const term=state.terms[state.idx];
  app.innerHTML=`
  <div class="header"><h1>Flashcards</h1><div class="sub">${state.idx+1} / ${state.terms.length} — ${term.ch}</div></div>
  <div class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" style="width:${(state.idx/state.terms.length*100).toFixed(0)}%"></div></div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="card" style="min-height:300px">
        <div class="flashcard-face flashcard-front">
          <div class="flash-term">${term.t}</div>
          <div class="flash-urdu-term">${term.u}</div>
          <div class="flash-hint">tap to reveal definition</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="flash-def">${term.d}</div>
          <div class="flash-def-urdu">${term.du}</div>
        </div>
      </div>
    </div>
    <div class="action-row">
      <button class="btn btn-outline btn-sm" onclick="renderHome()">← Home</button>
      ${state.idx>0?`<button class="btn btn-outline btn-sm" onclick="state.idx--;renderFlash()">← Prev</button>`:''}
      <button class="btn btn-gold btn-sm" onclick="state.idx++;renderFlash()">Next →</button>
    </div>
  </div>`;
  const cardEl=$('card');
  if(cardEl){
    cardEl.addEventListener('click',()=>cardEl.classList.toggle('flipped'));
    requestAnimationFrame(()=>{
      const faces=document.querySelectorAll('.flashcard-face');
      let mh=300;
      faces.forEach(f=>{const p=f.style.position;f.style.position='relative';mh=Math.max(mh,f.scrollHeight);f.style.position=p||'absolute';});
      cardEl.style.height=mh+'px';
      faces.forEach(f=>f.style.height=mh+'px');
    });
  }
}

// ---- MATCH ----
function renderMatch(){
  const allTerms=state.matchStore||getAllTerms(state.chapters);
  const batch=allTerms.slice(state.matchRound*6, state.matchRound*6+6);
  if(batch.length<2){renderHome();return;}
  const termCards=shuffle(batch.map((t,i)=>({id:i,type:'term',text:t.t,pair:i})));
  const defCards=shuffle(batch.map((t,i)=>({id:i+100,type:'def',text:t.d.length>80?t.d.slice(0,80)+'…':t.d,pair:i})));
  state.matchTerms=batch;state.matchPairs=[...termCards,...defCards];state.matchSelected=null;state.matched=new Set();state.matchTotal=batch.length;
  
  app.innerHTML=`
  <div class="header"><h1>Match Terms</h1><div class="sub">Round ${state.matchRound+1} — Match terms to definitions</div></div>
  <div class="quiz-screen">
    <div class="match-grid" id="matchGrid">
      <div>
        <div style="font-size:0.75rem;color:var(--gold);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Terms</div>
        ${termCards.map(c=>`<div class="match-card match-term" data-pair="${c.pair}" data-type="term" data-id="${c.id}" onclick="matchClick(this)">${c.text}</div>`).join('')}
      </div>
      <div>
        <div style="font-size:0.75rem;color:var(--gold);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Definitions</div>
        ${defCards.map(c=>`<div class="match-card match-def" data-pair="${c.pair}" data-type="def" data-id="${c.id}" onclick="matchClick(this)">${c.text}</div>`).join('')}
      </div>
    </div>
    <div class="action-row">
      <button class="btn btn-outline btn-sm" onclick="renderHome()">← Home</button>
      <button class="btn btn-gold btn-sm" onclick="state.matchRound++;renderMatch()">Next Round →</button>
    </div>
  </div>`;
}

function matchClick(el){
  if(el.classList.contains('matched')) return;
  if(!state.matchSelected){
    state.matchSelected=el;
    el.classList.add('selected');
  } else {
    const first=state.matchSelected;
    if(first===el){first.classList.remove('selected');state.matchSelected=null;return;}
    if(first.dataset.type===el.dataset.type){first.classList.remove('selected');state.matchSelected=el;el.classList.add('selected');return;}
    // check match
    if(first.dataset.pair===el.dataset.pair){
      first.classList.remove('selected');first.classList.add('matched');
      el.classList.add('matched');
      state.matched.add(parseInt(first.dataset.pair));
      if(state.matched.size===state.matchTotal){
        const mg=document.createElement('div');mg.className='match-complete';mg.textContent='\u2705 All matched! Great job!';
        const ar=document.querySelector('.action-row');if(ar)ar.parentNode.insertBefore(mg,ar);
      }
    } else {
      first.classList.remove('selected');
      el.classList.add('wrong-match');first.classList.add('wrong-match');
      setTimeout(()=>{el.classList.remove('wrong-match');first.classList.remove('wrong-match');},500);
    }
    state.matchSelected=null;
  }
}

// ---- RESULTS ----
function renderResults(){
  const total=state.terms.length;
  const pct=total?Math.round(state.score/total*100):0;
  const offset=477.5-(477.5*pct/100);
  const wrongList=state.answers.filter(a=>!a.correct);
  
  app.innerHTML=`
  <div class="header"><h1>Quiz Complete!</h1><div class="urdu-title">کوئز مکمل!</div></div>
  <div class="results-screen">
    <div class="score-ring">
      <svg viewBox="0 0 180 180" width="180" height="180"><circle class="ring-bg" cx="90" cy="90" r="76" fill="none" stroke-width="8"/><circle class="ring-fill" id="ringFill" cx="90" cy="90" r="76" fill="none" stroke-width="8"/></svg>
      <div class="score-text">${pct}%</div>
    </div>
    <div class="score-label">You got <strong>${state.score}</strong> out of <strong>${total}</strong> correct</div>
    <div class="result-stats">
      <div class="result-stat"><div class="num" style="color:var(--correct)">${state.score}</div><div class="lbl">Correct</div></div>
      <div class="result-stat"><div class="num" style="color:var(--wrong)">${state.wrong}</div><div class="lbl">Wrong</div></div>
      <div class="result-stat"><div class="num" style="color:var(--gold)">${total}</div><div class="lbl">Total</div></div>
    </div>
    ${wrongList.length?`
    <div style="text-align:left;margin-bottom:12px;font-weight:600;color:var(--wrong);font-size:0.9rem">Review Incorrect Answers:</div>
    <div class="review-list">
      ${wrongList.map(a=>{
        const t=state.terms.find(x=>x.t===a.term);
        return`<div class="review-item"><span class="review-icon">❌</span><div><span class="review-term">${a.term}</span> (${t?.u||''})<br><span class="review-answer">${t?.d||''}</span></div></div>`;
      }).join('')}
    </div>`:'<div style="color:var(--correct);font-size:1.1rem;font-weight:600;margin:20px 0">🏆 Perfect Score! Excellent work!</div>'}
    <div class="action-row" style="margin-top:24px">
      <button class="btn btn-outline btn-sm" onclick="renderHome()">← Home</button>
      <button class="btn btn-gold btn-sm" onclick="startMode(state.mode)">🔄 Retry (Shuffled)</button>
      ${wrongList.length?'<button class="btn btn-outline btn-sm" onclick="retryWrong()">🔁 Retry Wrong Only</button>':''}
    </div>
  </div>`;
  setTimeout(()=>{const r=$('ringFill');if(r)r.style.strokeDashoffset=offset;},100);
}

function retryWrong(){
  const wt=state.answers.filter(a=>!a.correct).map(a=>a.term);
  state.terms=shuffle(state.terms.filter(t=>wt.includes(t.t)));
  state.idx=0;state.score=0;state.wrong=0;state.answers=[];
  if(state.mode==='mcq')renderMCQ();else renderType();
}
// INIT
renderHome();
</script>
</body>
</html>
