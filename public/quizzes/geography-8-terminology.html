<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Geography 8 — Terminology Practice | Daanish Schools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#141042;--navy-med:#1E1860;--gold:#E8A820;--gold-dark:#C89018;--gold-light:#FDF3D8;--gold-glow:#E8A82040;--bg:#0C0A2E;--card:#16123E;--card-hover:#1C1850;--surface:#201C55;--text:#E8E6F4;--text-dim:#9994C8;--correct:#22C55E;--correct-bg:#22C55E18;--wrong:#EF4444;--wrong-bg:#EF444418;--urdu:#C4A0E8}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,#1a1060 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,#2a1848 0%,transparent 50%);z-index:-1}
.ctr{max-width:900px;margin:0 auto;padding:20px 20px 80px}
.hdr{text-align:center;padding:20px 20px 16px}.hdr::after{content:'';display:block;width:120px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0}
.hdr h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--gold),#FFD700,var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .sub{font-size:.85rem;color:var(--text-dim);margin-top:4px}.urdu-t{font-family:'Noto Nastaliq Urdu',serif;font-size:1rem;color:var(--urdu);direction:rtl;margin-top:4px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.brand img{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 10px var(--gold-glow)}
.brand .org{font-size:.72rem;font-weight:600;color:var(--gold);text-align:center}.brand .gov{font-size:.62rem;color:var(--text-dim);font-style:italic;text-align:center}
.acard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid #2A2680;border-radius:14px;padding:14px 18px;margin:14px auto;max-width:600px}
.acard img{width:68px;height:68px;border-radius:50%;border:3px solid var(--gold);flex-shrink:0;box-shadow:0 4px 14px rgba(232,168,32,.2)}
.acard .nm{font-size:1rem;font-weight:700;color:var(--gold)}.acard .ti{font-size:.72rem;color:var(--text-dim);line-height:1.5;margin-top:2px}
.acard .bk{font-size:.68rem;color:var(--gold-dark);font-style:italic;margin-top:2px}.acard .ct{font-size:.7rem;color:var(--urdu);margin-top:3px}.acard .ct a{color:var(--urdu);text-decoration:none}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.mc{background:var(--card);border:1px solid #2A2680;border-radius:14px;padding:24px 20px;cursor:pointer;transition:all .3s;overflow:hidden;position:relative}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-dark));transform:scaleX(0);transition:transform .3s}
.mc:hover{background:var(--card-hover);border-color:var(--gold);transform:translateY(-3px);box-shadow:0 10px 30px rgba(232,168,32,.1)}.mc:hover::before{transform:scaleX(1)}
.mc .ic{font-size:1.8rem;margin-bottom:10px}.mc .mt{font-size:1.05rem;font-weight:700;color:var(--gold);margin-bottom:4px}.mc .md{font-size:.78rem;color:var(--text-dim);line-height:1.5}
.csel{margin:18px 0}.csel label{font-size:.8rem;color:var(--text-dim);font-weight:500;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 14px;border-radius:18px;border:1px solid #2A2680;background:var(--card);color:var(--text-dim);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif}
.chip:hover{border-color:var(--gold);color:var(--text)}.chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .25s}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--navy)}.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(232,168,32,.3)}
.btn-o{background:transparent;border:1px solid #2A2680;color:var(--text-dim)}.btn-o:hover{border-color:var(--gold);color:var(--gold)}
.pbar{width:100%;height:4px;background:var(--surface);border-radius:4px;margin:18px 0 20px;overflow:hidden}.pfill{height:100%;background:linear-gradient(90deg,var(--gold),#FFD700);border-radius:4px;transition:width .5s}
.qstats{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:.8rem;color:var(--text-dim)}
.sb{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:var(--surface);font-weight:500}.sb-c{color:var(--correct)}.sb-w{color:var(--wrong)}
.qcard{background:var(--card);border:1px solid #2A2680;border-radius:18px;padding:28px 24px;margin-bottom:18px}
.qch{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold-dark);margin-bottom:10px}
.qt{font-size:1.15rem;font-weight:600;line-height:1.6;margin-bottom:8px}
.qu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;text-align:right;font-size:1rem;color:var(--urdu);line-height:2;padding:6px 10px;background:#1a1550;border-radius:8px;margin-bottom:6px}
.qi{font-size:.78rem;color:var(--text-dim);font-style:italic;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{padding:12px 16px;border:1px solid #2A2680;border-radius:10px;cursor:pointer;transition:all .2s;font-size:.88rem;display:flex;align-items:flex-start;gap:10px;line-height:1.5}
.opt:hover:not(.dis){border-color:var(--gold);background:var(--gold-glow)}
.opt .lt{width:26px;height:26px;border-radius:7px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;color:var(--gold)}
.opt.co{border-color:var(--correct);background:var(--correct-bg)}.opt.co .lt{background:var(--correct);color:#fff}
.opt.wo{border-color:var(--wrong);background:var(--wrong-bg)}.opt.wo .lt{background:var(--wrong);color:#fff}
.opt.dis{cursor:default;opacity:.6}.opt.dis.co{opacity:1}
.tinp{width:100%;padding:12px 16px;border:1px solid #2A2680;border-radius:10px;background:var(--surface);color:var(--text);font-family:'Outfit',sans-serif;font-size:1rem;outline:none;transition:border-color .2s;margin-top:8px}
.tinp:focus{border-color:var(--gold)}.tinp.ci{border-color:var(--correct);background:var(--correct-bg)}.tinp.wi{border-color:var(--wrong);background:var(--wrong-bg)}
.fcw{perspective:1000px;margin:18px 0;min-height:280px}.fc{width:100%;min-height:280px;position:relative;transform-style:preserve-3d;transition:transform .6s;cursor:pointer}.fc.flip{transform:rotateY(180deg)}
.fcf{position:absolute;width:100%;min-height:280px;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 26px;text-align:center}
.fcfr{background:linear-gradient(145deg,var(--card),var(--navy-med));border:1px solid #2A2680}
.fcbk{background:linear-gradient(145deg,#1a1555,#120e40);border:1px solid var(--gold-dark);transform:rotateY(180deg)}
.fterm{font-size:1.7rem;font-weight:700;color:var(--gold);margin-bottom:8px}.furdu{font-family:'Noto Nastaliq Urdu',serif;font-size:1.2rem;color:var(--urdu);direction:rtl}
.fhint{font-size:.72rem;color:var(--text-dim);margin-top:14px}.fdef{font-size:.95rem;line-height:1.7;color:var(--text);margin-bottom:10px}
.fdefu{font-family:'Noto Nastaliq Urdu',serif;font-size:.9rem;direction:rtl;color:var(--urdu);line-height:2}
.fb{padding:10px 14px;border-radius:9px;margin-top:10px;font-size:.85rem;font-weight:500;line-height:1.5;animation:fu .3s}
.fb-c{background:var(--correct-bg);border:1px solid #22C55E40;color:var(--correct)}.fb-w{background:var(--wrong-bg);border:1px solid #EF444440;color:var(--wrong)}
.ar{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.sring{width:170px;height:170px;margin:26px auto 16px;position:relative}.sring svg{transform:rotate(-90deg)}.sring circle{fill:none;stroke-width:8;cx:85;cy:85;r:72}
.sring .rbg{stroke:var(--surface)}.sring .rfill{stroke:var(--gold);stroke-dasharray:452.4;stroke-dashoffset:452.4;stroke-linecap:round;transition:stroke-dashoffset 1.5s}
.stxt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.3rem;font-weight:800;color:var(--gold)}
.slbl{font-size:.82rem;color:var(--text-dim);margin-bottom:24px;text-align:center}
.rstats{display:flex;justify-content:center;gap:28px;margin-bottom:24px}.rst{text-align:center}.rst .n{font-size:1.6rem;font-weight:700}.rst .l{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.rvl{text-align:left;margin:18px 0}.rvi{padding:12px 14px;border-radius:10px;border:1px solid #2A2680;margin-bottom:7px;background:var(--card);display:flex;gap:10px;align-items:flex-start;font-size:.82rem;line-height:1.5}
.rvt{font-weight:600;color:var(--gold)}.rva{color:var(--text-dim)}
.matchg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.matchc{padding:12px 14px;border:1px solid #2A2680;border-radius:10px;cursor:pointer;transition:all .2s;font-size:.82rem;line-height:1.5;min-height:48px;display:flex;align-items:center}
.matchc:hover:not(.mok):not(.msel){border-color:var(--gold);background:var(--gold-glow)}
.matchc.msel{border-color:var(--gold);background:var(--gold-glow);box-shadow:0 0 14px var(--gold-glow)}
.matchc.mok{border-color:var(--correct);background:var(--correct-bg);opacity:.5;pointer-events:none}
.matchc.mwrong{animation:shake .4s;border-color:var(--wrong);background:var(--wrong-bg)}
.mterm{font-weight:600;color:var(--gold)}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:2px solid #2A2680;padding:10px 20px;text-align:center;z-index:100}
.footer-inner{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.footer img{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold)}
.footer .ftxt{font-size:.72rem;color:var(--text-dim);font-style:italic}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(max-width:640px){.mg,.matchg{grid-template-columns:1fr}.hdr h1{font-size:1.5rem}.acard{flex-direction:column;text-align:center}}
</style></head><body>

var D=[{c:"Ch 1: Oceans & Seas",t:[{t:"Ocean",u:"سمندر",d:"A huge body of salt water on the Earth's surface.",du:"زمین پر کھارے پانی کا بہت بڑا ذخیرہ۔"},{t:"Sea",u:"بحر",d:"Part of ocean partly enclosed by land, a smaller body on the margins of the ocean.",du:"سمندر کا جزوی طور پر خشکی سے گھرا حصہ۔"},{t:"Pacific Ocean",u:"بحرالکاہل",d:"Largest ocean. Area 166 million sq km, depth 4280m. Between Asia, Australia and the Americas.",du:"سب سے بڑا سمندر۔ 166 ملین مربع کلومیٹر، گہرائی 4280 میٹر۔"},{t:"Atlantic Ocean",u:"بحر اوقیانوس",d:"Second largest ocean. Area 82 million sq km, depth 3900m. Busiest trade route.",du:"دوسرا بڑا سمندر۔ 82 ملین مربع کلومیٹر۔ مصروف ترین تجارتی راستہ۔"},{t:"Indian Ocean",u:"بحر ہند",d:"Third largest ocean. Area 73 million sq km, depth 3900m. Between Africa, Asia, Australia.",du:"تیسرا بڑا سمندر۔ 73 ملین مربع کلومیٹر، گہرائی 3900 میٹر۔"},{t:"Antarctic Ocean",u:"بحر منجمد جنوبی",d:"Fourth largest. Area 22 million sq km, depth 3200m. Across the Antarctic circle.",du:"چوتھا بڑا سمندر۔ 22 ملین مربع کلومیٹر، گہرائی 3200 میٹر۔"},{t:"Arctic Ocean",u:"بحر منجمد شمالی",d:"Smallest ocean around North Pole. Area 15 million sq km, depth 1200m. Low salinity, frozen surface.",du:"قطب شمالی کے گرد سب سے چھوٹا سمندر۔ کم نمکیات، جمی سطح۔"},{t:"Peninsula",u:"جزیرہ نما",d:"Land surrounded by water from three sides, connected to mainland by isthmus. e.g. Arabian, Indian.",du:"تین اطراف سے پانی سے گھری خشکی جو تنگ پٹی سے جڑی ہو۔"},{t:"Isthmus",u:"خشکی کی تنگ پٹی",d:"Narrow strip connecting two large land masses, separating two water bodies. e.g. Panama, Suez.",du:"دو بڑے خشکی کے ٹکڑوں کو جوڑنے والی تنگ پٹی۔"},{t:"Gulf",u:"خلیج",d:"Large but narrow part of ocean invading farther inland. e.g. Persian Gulf, Gulf of Mexico.",du:"سمندر کا بڑا لیکن تنگ حصہ جو خشکی میں داخل ہو۔"},{t:"Bay",u:"کھاڑی",d:"Large vast part of ocean invading inland, contrary to gulf. e.g. Bay of Bengal, Hudson Bay.",du:"سمندر کا وسیع حصہ جو خشکی میں داخل ہو۔ خلیج کے برعکس۔"},{t:"Strait",u:"آبنائے",d:"Narrow channel connecting two large bodies of water. e.g. Strait of Gibraltar.",du:"دو بڑے آبی ذخائر کو جوڑنے والی تنگ گزرگاہ۔"},{t:"Island",u:"جزیرہ",d:"Land surrounded by water from all sides. e.g. Sri Lanka, Greenland.",du:"چاروں طرف پانی سے گھری خشکی۔"},{t:"Waves",u:"لہریں",d:"Movement of surface water due to winds. Top is crest, bottom is trough.",du:"ہوا سے سطحی پانی کی حرکت۔ اوپر کریسٹ، نیچے ٹرف۔"},{t:"Wavelength",u:"لہر کی لمبائی",d:"Horizontal distance between two crests or troughs.",du:"دو کریسٹوں کے درمیان افقی فاصلہ۔"},{t:"Wave Height",u:"لہر کی اونچائی",d:"Vertical distance between crest and trough.",du:"کریسٹ اور ٹرف کا عمودی فاصلہ۔"},{t:"Crest",u:"لہر کی چوٹی",d:"The top or highest point of a wave.",du:"لہر کا سب سے اونچا مقام۔"},{t:"Trough",u:"لہر کا نچلا حصہ",d:"The bottom or lowest point of a wave.",du:"لہر کا سب سے نچلا مقام۔"},{t:"Currents",u:"سمندری دھارے",d:"Permanent flow of ocean water in a specific direction. Clockwise in north, anti-clockwise in south.",du:"سمندری پانی کا مخصوص سمت میں مستقل بہاؤ۔"},{t:"Warm Current",u:"گرم دھارا",d:"Flows from equator to polar areas, increasing coastal temperature. e.g. Gulf Stream.",du:"خط استوا سے قطبی علاقوں کی طرف بہنے والے دھارے۔"},{t:"Cold Current",u:"ٹھنڈا دھارا",d:"Flows from polar areas to equator. e.g. Labrador, Kamchatka current.",du:"قطبی علاقوں سے خط استوا کی طرف بہنے والے دھارے۔"},{t:"Drift",u:"بڑا دھارا",d:"A larger current formed by joining of two currents.",du:"دو دھاروں کے ملنے سے بننے والا بڑا دھارا۔"},{t:"Tides",u:"جوار بھاٹا",d:"Continuous rise and fall of sea level, twice daily. Caused by Moon's gravitation.",du:"سمندر کی سطح میں مسلسل اتار چڑھاؤ۔ وجہ چاند کی کشش ثقل۔"},{t:"Spring Tides",u:"اونچا جوار",d:"Very high tides on 1st and 14th of lunar month when Sun, Earth, Moon align.",du:"پہلی اور 14ویں تاریخ کو بہت اونچا جوار۔"},{t:"Neap Tides",u:"نیچا جوار",d:"Low tides on 7th and 21st when Moon and Sun are perpendicular to Earth.",du:"7ویں اور 21ویں تاریخ کو نیچا جوار۔"},{t:"Tsunami",u:"سونامی",d:"Huge waves from earthquake beneath the ocean floor.",du:"سمندر کی تہہ میں زلزلے سے بڑی لہریں۔"},{t:"Marine Biodiversity",u:"سمندری حیاتیاتی تنوع",d:"Variety of life in ocean: fish, seals, walruses, corals, mollusks etc.",du:"سمندر میں زندگی کی مختلف اقسام۔"},{t:"Phytoplankton",u:"فائیٹو پلانکٹن",d:"Microscopic plant absorbing CO2 and releasing oxygen, like tree leaves.",du:"خوردبینی پودا جو CO2 جذب اور آکسیجن خارج کرتا ہے۔"},{t:"Thermocline",u:"تھرموکلائن",d:"Middle Layer of ocean water, temperature 5 to 20 degrees C.",du:"سمندری پانی کی درمیانی تہہ، 5 سے 20 ڈگری۔"},{t:"Warm Surface Layer",u:"گرم سطحی تہہ",d:"First layer of ocean water, temperature 20 to 25 degrees C.",du:"سمندری پانی کی پہلی تہہ، 20 سے 25 ڈگری۔"},{t:"Cold Deep Layer",u:"ٹھنڈی گہری تہہ",d:"Deepest layer of ocean water, temperature 0 to minus 5 degrees C.",du:"سب سے گہری تہہ، 0 سے منفی 5 ڈگری۔"},{t:"Mariana Trench",u:"ماریانا ٹرینچ",d:"Deepest point of Earth in Pacific Ocean. Depth 36,201 feet.",du:"بحرالکاہل میں زمین کا سب سے گہرا مقام، 36,201 فٹ۔"},{t:"Mid-Oceanic Ridge",u:"وسط سمندری پہاڑی سلسلہ",d:"Result of magma eruption at divergent plate boundary. Feature of Atlantic Ocean.",du:"پلیٹوں کی علیحدگی پر میگما کے اخراج کا نتیجہ۔ بحر اوقیانوس کی خصوصیت۔"},{t:"Salinity",u:"نمکیات",d:"Salt content of ocean water. Variation causes current circulation.",du:"سمندری پانی میں نمک۔ تبدیلی دھاروں کا سبب بنتی ہے۔"},{t:"Panama Canal",u:"نہر پاناما",d:"Links Pacific with Atlantic Ocean. Important world trade route.",du:"بحرالکاہل کو بحر اوقیانوس سے جوڑتی ہے۔ اہم تجارتی راستہ۔"},{t:"Suez Canal",u:"نہر سوئز",d:"Links Red Sea with Mediterranean Sea. Important East-West trade route.",du:"بحیرہ احمر کو بحیرہ روم سے جوڑتی ہے۔ مشرق مغرب تجارتی راستہ۔"}]},{c:"Ch 2: Living with Climate",t:[{t:"Weather",u:"موسم",d:"Conditions of atmosphere over a short period of time.",du:"مختصر وقت کے لیے فضا کی حالت۔"},{t:"Climate",u:"آب و ہوا",d:"Long term (minimum 30 years) average weather conditions of a region.",du:"کم از کم 30 سال کے اوسط موسمی حالات۔"},{t:"Extreme Weather",u:"شدید موسم",d:"Weather event significantly different from average or usual weather patterns.",du:"اوسط موسمی انداز سے نمایاں طور پر مختلف واقعہ۔"},{t:"Heat Wave",u:"گرمی کی لہر",d:"Severe high temperature. 49C struck Pakistan June 2015, causing about 2000 deaths.",du:"شدید گرمی۔ جون 2015 میں پاکستان میں 49 ڈگری، 2000 اموات۔"},{t:"Drought",u:"خشک سالی",d:"Below-average rainfall causing soil to dry and plants to die. e.g. Thar in Sindh.",du:"اوسط سے کم بارش سے مٹی خشک اور پودے مر جائیں۔"},{t:"Heavy Rainfall",u:"شدید بارش",d:"Leads to flash flooding. Sindh, Balochistan, Southern Punjab suffered severe flood in 2022.",du:"اچانک سیلاب کا سبب۔ 2022 میں سندھ، بلوچستان متاثر۔"},{t:"Cold Spell",u:"سردی کی شدید لہر",d:"Extreme cold. Jan 2022 snowstorm in Murree dropped 4 feet snow, 23 tourists killed.",du:"شدید سردی۔ جنوری 2022 مری میں 4 فٹ برف، 23 سیاح ہلاک۔"},{t:"Climate Change",u:"موسمیاتی تبدیلی",d:"Long-term shifts in temperature and weather caused by increase of CO2 and greenhouse gases.",du:"گرین ہاؤس گیسوں سے درجہ حرارت اور موسم میں طویل مدتی تبدیلیاں۔"},{t:"Global Warming",u:"عالمی حدت",d:"Rising surface temperature of Earth. 2011-2020 was warmest decade. Accelerated since Industrial Revolution.",du:"زمین کا بڑھتا درجہ حرارت۔ 2011-2020 سب سے گرم دہائی۔"},{t:"Greenhouse Effect",u:"گرین ہاؤس اثر",d:"Gases absorb infrared radiation, trap heat, warm the planet. Without it Earth 30 degrees colder.",du:"گیسیں حرارت روکتی ہیں۔ اس کے بغیر زمین 30 ڈگری ٹھنڈی ہوتی۔"},{t:"Enhanced Greenhouse Effect",u:"بڑھا ہوا گرین ہاؤس اثر",d:"Since Industrial Revolution, more greenhouse gases trap more heat. Main cause of climate change.",du:"صنعتی انقلاب سے مزید گیسیں مزید حرارت روکیں۔ موسمیاتی تبدیلی کی وجہ۔"},{t:"Greenhouse Gases",u:"گرین ہاؤس گیسیں",d:"CO2, Water Vapours (H2O), Ozone (O3), Methane (CH4) trap Sun's heat.",du:"CO2، آبی بخارات، اوزون، میتھین سورج کی حرارت روکیں۔"},{t:"Deforestation",u:"جنگلات کی کٹائی",d:"Responsible for 15% of greenhouse gases in the atmosphere.",du:"فضا میں 15% گرین ہاؤس گیسوں کی ذمہ دار۔"},{t:"Acid Rain",u:"تیزابی بارش",d:"Precipitation with acidic components like sulphuric or nitric acid.",du:"تیزابی اجزاء والی بارش جیسے سلفیورک یا نائٹرک تیزاب۔"},{t:"Smog",u:"سموگ",d:"Air pollution from smoke and fog mixture. Photochemical Smog described in 1950s.",du:"دھوئیں اور دھند سے فضائی آلودگی۔"},{t:"Hydrologic Cycle",u:"آبی چکر",d:"Continuous cycle: condensation, precipitation, transpiration, evaporation, runoff, infiltration.",du:"پانی کی حرکت کا مسلسل چکر: کثافت، بارش، تبخیر، بہاؤ۔"},{t:"Tropical Zone",u:"اشنکٹبندیی خطہ",d:"Between Tropic of Cancer (23N) and Tropic of Capricorn (23S).",du:"مدار سرطان (23 شمال) اور مدار جدی (23 جنوب) کے درمیان۔"},{t:"Equatorial Climate",u:"استوائی آب و ہوا",d:"10N to 10S of equator. Hot, wet year-round. Dense evergreen forests. Amazon, Congo, Malaysia.",du:"خط استوا سے 10 ڈگری۔ سال بھر گرم مرطوب۔ گھنے سدا بہار جنگلات۔"},{t:"Monsoon Climate",u:"مون سون آب و ہوا",d:"10 to 25 degrees N/S. Agriculture is main occupation. India, Sri Lanka, Bangladesh.",du:"10 سے 25 ڈگری شمال/جنوب۔ زراعت بنیادی پیشہ۔"},{t:"Polar Climate",u:"قطبی آب و ہوا",d:"Around Poles. Short summer, long winter. Snow precipitation. Nomadic life, igloos.",du:"قطبین کے گرد۔ مختصر گرمی، طویل سردی۔ برف۔ خانہ بدوش زندگی۔"},{t:"Tropical Cyclones",u:"اشنکٹبندیی طوفان",d:"Arabian Sea cyclones from mid-May to mid-July and October. Climate change increased frequency.",du:"بحیرہ عرب میں مئی سے جولائی اور اکتوبر کے طوفان۔"},{t:"Igloo",u:"اگلو",d:"Houses built with ice by Tundra region people.",du:"ٹنڈرا خطے کے لوگوں کے برف کے گھر۔"},{t:"Roof Garden",u:"چھت باغ",d:"Umbrella type vegetative cover on Amazon basin trees (called selves).",du:"ایمیزون طاس کے درختوں پر چھتری نما پودوں کی چھت۔"}]},{c:"Ch 3: Environmental Pollution",t:[{t:"Environment",u:"ماحول",d:"All living and non-living things around us. Two parts: Natural and Human environment.",du:"ارد گرد کی تمام جاندار اور بے جان چیزیں۔ دو حصے: قدرتی اور انسانی۔"},{t:"Natural Environment",u:"قدرتی ماحول",d:"Atmosphere (air), Hydrosphere (water), Biosphere (vegetation/animals), Lithosphere (soils/rocks).",du:"فضا، آبی کرہ، حیاتی کرہ، ارضی کرہ۔"},{t:"Human Environment",u:"انسانی ماحول",d:"Features made by humans: buildings, roads, transport, schools, factories.",du:"انسان کی بنائی چیزیں: عمارتیں، سڑکیں، ٹرانسپورٹ۔"},{t:"Atmosphere",u:"فضا",d:"The envelope of gases (air) surrounding the Earth.",du:"زمین کو گھیرنے والی گیسوں کا غلاف۔"},{t:"Hydrosphere",u:"آبی کرہ",d:"The water component of the environment.",du:"ماحول کا پانی والا حصہ۔"},{t:"Biosphere",u:"حیاتی کرہ",d:"The vegetation and animals component of the environment.",du:"نباتات اور حیوانات کا حصہ۔"},{t:"Lithosphere",u:"ارضی کرہ",d:"The soils and rocks component of the environment.",du:"مٹی اور چٹانوں کا حصہ۔"},{t:"Pollution",u:"آلودگی",d:"Irregular presence of unwanted harmful substance in the environment.",du:"ماحول میں نقصان دہ مادے کی غیر معمولی موجودگی۔"},{t:"Pollutants",u:"آلودہ کرنے والے مادے",d:"Harmful substances damaging air, water, land. Can be natural (volcanic ash) or man-made.",du:"ہوا، پانی، زمین خراب کرنے والے نقصان دہ مادے۔ قدرتی یا انسانی۔"},{t:"Water Pollution",u:"آبی آلودگی",d:"Unwanted change in physical/chemical composition of water causing damage to life.",du:"پانی کی ساخت میں نقصان دہ تبدیلی۔"},{t:"Soil Pollution",u:"زمینی آلودگی",d:"Undesired change in soil composition negatively impacting organic life on Earth.",du:"مٹی کی ساخت میں ناپسندیدہ تبدیلی جو نامیاتی زندگی کو متاثر کرے۔"},{t:"Air Pollution",u:"فضائی آلودگی",d:"Increasing harmful gases, dust, smoke, chemical compounds, UV radiation in atmosphere.",du:"فضا میں نقصان دہ گیسوں، دھول، دھوئیں کی بڑھتی سطح۔"},{t:"Noise Pollution",u:"شور کی آلودگی",d:"High pitched sounds creating disturbance for hearing abilities.",du:"تیز آوازیں جو سماعت میں خلل پیدا کریں۔"},{t:"Light Pollution",u:"روشنی کی آلودگی",d:"Excessive artificial outdoor light at night. Includes trespass, over-illumination, glare, skyglow.",du:"رات کو ضرورت سے زیادہ مصنوعی روشنی۔"},{t:"Ozone Layer",u:"اوزون کی تہہ",d:"Protective gaseous envelope (O3) shielding Earth from harmful UV radiation.",du:"زمین کو UV شعاعوں سے بچانے والا حفاظتی غلاف۔"},{t:"Ozone Depletion",u:"اوزون کا پتلا ہونا",d:"Thinning caused by CFCs allowing UV rays to reach Earth. May cause skin cancer.",du:"CFCs سے اوزون پتلا ہونا جس سے UV شعاعیں زمین تک پہنچیں۔"},{t:"CFCs",u:"کلوروفلوروکاربن",d:"Chlorofluorocarbons - gases dangerous to ozone from AC and refrigerators.",du:"اوزون کے لیے خطرناک گیسیں جو AC اور فریج سے خارج ہوں۔"},{t:"Sustainable Development",u:"پائیدار ترقی",d:"Meeting present needs without compromising future generations' ability to meet theirs.",du:"آنے والی نسلوں کو متاثر کیے بغیر ضروریات پوری کرنا۔"},{t:"3Rs Policy",u:"تین آر پالیسی",d:"Reduce, Reuse and Recycle - main rules to reduce pollution impacts.",du:"کم کرو، دوبارہ استعمال کرو، ری سائیکل کرو۔"},{t:"Eutrophication",u:"یوٹروفیکیشن",d:"Accumulation of nutrients in water causing algae blooms and loss of oxygen and life.",du:"پانی میں غذائی اجزاء جمع ہونا جس سے کائی پھیلے اور آکسیجن ختم ہو۔"},{t:"Toxicity",u:"زہریلا پن",d:"Result of water pollution leading to death of aquatic life.",du:"آبی آلودگی کا نتیجہ جو آبی زندگی کی موت کا سبب بنے۔"},{t:"Green Travel",u:"سبز سفر",d:"Travel with minimum environmental impact: bicycle or walking. Also called sustainable travel.",du:"ماحول پر کم اثر والا سفر: سائیکل یا پیدل۔"},{t:"Paris Climate Agreement",u:"پیرس معاہدہ",d:"Climate agreement signed by 196 countries in 2015, Paris, France.",du:"2015 میں پیرس میں 196 ممالک کا موسمیاتی معاہدہ۔"}]},{c:"Ch 4: Industrialization & Trade",t:[{t:"Industrialization",u:"صنعت کاری",d:"Economy transformed from agricultural to industrial-based. Manual labour replaced by mechanized production.",du:"معیشت زرعی سے صنعتی۔ دستی مشقت کی جگہ مشینی پیداوار۔"},{t:"Immigration",u:"ہجرت",d:"Individuals become permanent residents of another country due to industrialization.",du:"صنعت کاری سے افراد دوسرے ملک کے مستقل رہائشی بنیں۔"},{t:"Urbanization",u:"شہر کاری",d:"Growth of cities when large numbers settle permanently in small areas.",du:"بڑی تعداد کے چھوٹے علاقوں میں آباد ہونے سے شہروں کی نشوونما۔"},{t:"Agglomeration",u:"آبادی کا ارتکاز",d:"Increasing density of population in urban areas.",du:"شہری علاقوں میں آبادی کی بڑھتی کثافت۔"},{t:"Textile Industry",u:"ٹیکسٹائل صنعت",d:"Most important large-scale industry in Pakistan. 500+ mills, 60% exports, 40% cotton products.",du:"پاکستان کی سب سے اہم بڑی صنعت۔ 500+ ملیں، 60% برآمدات۔"},{t:"Cottage Industry",u:"گھریلو صنعت",d:"Small-scale using local material, hand tools. Products: carpets, pottery, sports goods, leather.",du:"مقامی مال اور ہاتھ کے اوزار۔ قالین، مٹی کے برتن، کھیلوں کا سامان۔"},{t:"Ginning",u:"جننگ",d:"Separating seeds from cotton bolls using a machine called a gin.",du:"کپاس کے ٹنڈوں سے بیج نکالنا۔"},{t:"Spinning",u:"کتائی",d:"Making yarn from raw cotton.",du:"خام کپاس سے دھاگہ بنانا۔"},{t:"Weaving",u:"بنائی",d:"Production of cloth from yarn.",du:"دھاگے سے کپڑا بنانا۔"},{t:"Trade",u:"تجارت",d:"Exchange of imports (buying) and exports (selling) between countries.",du:"ممالک کے درمیان درآمد اور برآمد کا تبادلہ۔"},{t:"Imports",u:"درآمدات",d:"Goods bought from other countries. Pakistan's: edible oil, crude oil, IT products, machinery, steel.",du:"دوسرے ممالک سے خریدا جانے والا سامان۔"},{t:"Exports",u:"برآمدات",d:"Goods sold to other countries. Pakistan's: cotton products, fish, sports goods, leather, surgical instruments.",du:"دوسرے ممالک کو فروخت سامان۔"},{t:"Balance of Trade",u:"توازن تجارت",d:"Difference between value of exports and imports.",du:"برآمدات اور درآمدات کی قدر میں فرق۔"},{t:"WTO",u:"عالمی تجارتی تنظیم",d:"World Trade Organization - sets trade rules for member countries.",du:"عالمی تجارتی تنظیم۔ تجارتی قوانین مقرر کرتی ہے۔"},{t:"TDAP",u:"ٹی ڈی اے پی",d:"Trade Development Authority of Pakistan - ensures WTO standards for trade goods.",du:"پاکستان کی تجارتی ترقیاتی اتھارٹی۔ WTO معیار یقینی بنائے۔"},{t:"Bilateral Trade",u:"دو طرفہ تجارت",d:"Trade between two countries. e.g. Pakistan and China.",du:"دو ممالک کے درمیان تجارت۔ مثلاً پاکستان اور چین۔"},{t:"CPEC",u:"سی پیک",d:"China-Pakistan Economic Corridor. Projects: Gwadar Port, Chashma Nuclear, Taxila Complex.",du:"چین پاکستان اقتصادی راہداری۔ گوادر، چشمہ ایٹمی، ٹیکسلا۔"},{t:"Per Capita Income",u:"فی کس آمدنی",d:"Average income per person. Pakistan: 1465 USD in 2021.",du:"فی فرد اوسط آمدنی۔ پاکستان: 2021 میں 1465 ڈالر۔"},{t:"Karakoram Highway",u:"شاہراہ قراقرم",d:"Highway by mutual Pakistan-China economic and technical support.",du:"پاک چین باہمی تعاون سے بنی شاہراہ۔"},{t:"Raw Material",u:"خام مال",d:"Basic unprocessed materials used as inputs in manufacturing.",du:"مصنوعات بنانے میں استعمال ہونے والا بنیادی مواد۔"},{t:"Rural-Urban Migration",u:"دیہی شہری نقل مکانی",d:"People moving to industrial areas for better-paid jobs and facilities.",du:"بہتر ملازمتوں کے لیے لوگوں کا صنعتی علاقوں میں منتقل ہونا۔"}]},{c:"Ch 5: Transport & Importance",t:[{t:"Transport",u:"نقل و حمل",d:"Essential for trade and development. Three types: land, water and air.",du:"تجارت اور ترقی کے لیے ضروری۔ تین اقسام: زمینی، آبی، فضائی۔"},{t:"Land Transport",u:"زمینی نقل و حمل",d:"Through roads and rails. Divided into Road and Rail Transport.",du:"سڑکوں اور ریلوں کے ذریعے۔ سڑک اور ریل میں تقسیم۔"},{t:"Road Transport",u:"سڑک ٹرانسپورٹ",d:"Most versatile. 82% passenger, 54% freight. Pakistan: 260,000 km roads, 48 highways.",du:"سب سے لچکدار۔ 82% مسافر، 54% مال۔ 260,000 کلومیٹر سڑکیں۔"},{t:"Rail Transport",u:"ریل ٹرانسپورٹ",d:"For heavy loads cheaply over long distances: coal, grain, timber, metal ores.",du:"بھاری سامان لمبے فاصلوں پر سستے: کوئلہ، اناج، لکڑی۔"},{t:"Water Transport",u:"آبی نقل و حمل",d:"Ships for international trade. Cheapest for bulky goods over long distances.",du:"بین الاقوامی تجارت کے لیے جہاز۔ بھاری سامان کے لیے سب سے سستا۔"},{t:"Air Transport",u:"فضائی نقل و حمل",d:"Fastest, most modern, costly. For urgent needs and inaccessible areas.",du:"تیز ترین، جدید ترین، مہنگا۔ فوری ضرورت کے لیے۔"},{t:"Motorway",u:"موٹر وے",d:"Wide long distance roads specially constructed for fast-moving traffic.",du:"تیز رفتار ٹریفک کے لیے بنائی گئی چوڑی سڑکیں۔"},{t:"Grand Trunk Road",u:"شاہراہ اعظم",d:"G.T. Road, Peshawar to Lahore. Highest traffic density in Pakistan.",du:"پشاور سے لاہور۔ پاکستان میں سب سے زیادہ ٹریفک۔"},{t:"NHA",u:"نیشنل ہائی وے اتھارٹی",d:"National Highway Authority for development and maintenance of national highways.",du:"قومی شاہراہوں کی ترقی اور دیکھ بھال کا ادارہ۔"},{t:"Pakistan Railways",u:"پاکستان ریلوے",d:"Introduced May 1861. Karachi-Kotri first link (155 km). Thousands of workers.",du:"مئی 1861 میں شروع۔ کراچی-کوٹری پہلا رابطہ (155 کلومیٹر)۔"},{t:"PIA",u:"پی آئی اے",d:"Pakistan International Airlines. Symbol of national pride. CAA manages civil aviation.",du:"پاکستان انٹرنیشنل ایئر لائنز۔ قومی فخر کی علامت۔"},{t:"KCR",u:"کے سی آر",d:"Karachi Circular Railway. 14 km Orangi-City route.",du:"کراچی سرکلر ریلوے۔ 14 کلومیٹر اورنگی سٹی روٹ۔"},{t:"Keamari Seaport",u:"کیماری بندرگاہ",d:"Oldest, most important port of Pakistan in Karachi. Iron ore, coal, steel, oil, rice, wheat.",du:"کراچی میں پاکستان کی قدیم ترین اور اہم ترین بندرگاہ۔"},{t:"Port Qasim",u:"بندرگاہ قاسم",d:"Second largest port near Steel Mills. 30% of Pakistan's cargo. 20 km SE of Karachi.",du:"دوسری سب سے بڑی بندرگاہ۔ 30% کارگو۔ کراچی سے 20 کلومیٹر۔"},{t:"Gwadar Port",u:"گوادر بندرگاہ",d:"Deep sea port, Balochistan. World's deepest. Inaugurated 2007. Bought from Oman 1958, $300,000.",du:"بلوچستان کی گہری بندرگاہ۔ دنیا کی سب سے گہری۔ 1958 میں عمان سے خریدی۔"},{t:"North Atlantic Route",u:"شمالی بحر اوقیانوس راستہ",d:"Busiest ocean route. W. Europe to E. North America. Wheat, machinery, clothing.",du:"سب سے مصروف سمندری راستہ۔ مغربی یورپ سے شمالی امریکہ۔"},{t:"East-West Route",u:"مشرق مغرب راستہ",d:"Europe to Far East via Mediterranean and Suez Canal. Oil, rubber, timber.",du:"یورپ سے مشرق بعید بحیرہ روم اور نہر سوئز سے۔"},{t:"Silk Route",u:"شاہراہ ریشم",d:"Ancient trade route connecting Pakistan and China.",du:"پاکستان اور چین کا قدیم تجارتی راستہ۔"},{t:"Khunjerab Pass",u:"خنجراب درہ",d:"Mountain pass linking Pakistan-China through Gilgit for trade and diplomacy.",du:"گلگت سے پاکستان چین کو تجارت و سفارت کاری کے لیے جوڑتا ہے۔"},{t:"Transport Infrastructure",u:"نقل و حمل کا ڈھانچہ",d:"Framework supporting transport: roads, railways, ports, airports.",du:"سڑکیں، ریلوے، بندرگاہیں، ہوائی اڈے۔"},{t:"Jinnah International Airport",u:"جناح بین الاقوامی ہوائی اڈا",d:"Pakistan's busiest airport in Karachi.",du:"پاکستان کا سب سے مصروف ہوائی اڈا، کراچی۔"}]},{c:"Ch 6: Social & Economic Development",t:[{t:"Economic Development",u:"اقتصادی ترقی",d:"Change in national income over time with technical and institutional changes.",du:"قومی آمدنی میں وقت کے ساتھ تبدیلی بمع تکنیکی تبدیلیاں۔"},{t:"Economic Growth",u:"اقتصادی نمو",d:"Rise in per capita income. More output from the economy.",du:"فی کس آمدنی میں اضافہ۔ زیادہ پیداوار۔"},{t:"Per Capita GNP",u:"فی کس مجموعی قومی پیداوار",d:"Best indicator of well-being. Total national income divided by population.",du:"بہبود کا بہترین پیمانہ۔ کل قومی آمدنی تقسیم آبادی۔"},{t:"Per Capita Energy Consumption",u:"فی کس توانائی استعمال",d:"Measure of production in terms of power. Close relationship with economic activity.",du:"خرچ طاقت سے پیداوار کا پیمانہ۔ اقتصادی سرگرمی سے گہرا تعلق۔"},{t:"Primary Activities",u:"بنیادی سرگرمیاں",d:"Agriculture, fishing, forestry, mining. Agriculture most important.",du:"زراعت، ماہی گیری، جنگلات، کان کنی۔ زراعت سب سے اہم۔"},{t:"Secondary Activities",u:"ثانوی سرگرمیاں",d:"Manufacturing and industrial production. Factories and power plants.",du:"صنعتی پیداوار۔ فیکٹریاں اور بجلی گھر۔"},{t:"GDP",u:"مجموعی ملکی پیداوار",d:"Total market value of all finished goods and services produced within a country.",du:"ملک میں تمام مصنوعات اور خدمات کی کل قدر۔"},{t:"GNP",u:"مجموعی قومی پیداوار",d:"Total value of goods and services produced by a nation's residents.",du:"ملک کے باشندوں کی اشیاء اور خدمات کی کل قدر۔"},{t:"HDI",u:"انسانی ترقی اشاریہ",d:"Human Development Index: Health, Education, Living Standard. Pakistan: 161/192 (2021-22).",du:"صحت، تعلیم، معیار زندگی کا پیمانہ۔ پاکستان 161/192۔"},{t:"Life Expectancy",u:"متوقع عمر",d:"Age a person is expected to live at birth. Ultimate development indicator.",du:"پیدائش پر متوقع عمر۔ ترقی کا حتمی پیمانہ۔"},{t:"Standard of Living",u:"معیار زندگی",d:"Quantity and quality of goods and services available to a population.",du:"آبادی کے لیے دستیاب اشیاء اور خدمات کا معیار۔"},{t:"Inflation",u:"مہنگائی",d:"Rise in prices, decline of purchasing power. Controlled = prosperity; too high = suffering.",du:"قیمتوں میں اضافہ، قوت خرید میں کمی۔ قابو میں ہو تو خوشحالی۔"},{t:"Unemployment",u:"بے روزگاری",d:"Person searches for job but cannot find it. Key negative economy measure.",du:"ملازمت تلاش مگر نہ ملے۔ معیشت کا اہم منفی پیمانہ۔"},{t:"LDCs",u:"کم ترقی یافتہ ممالک",d:"Less Developed Countries. Rapid population growth, poor education/health, poverty.",du:"تیز آبادی، کمزور تعلیم/صحت، غربت، کم بچت۔"},{t:"HDCs",u:"ترقی یافتہ ممالک",d:"Highly Developed Countries. Advanced economies, high capital, strong technology.",du:"ترقی یافتہ معیشتیں، زیادہ سرمایہ، مضبوط تکنیکی جدت۔"},{t:"EDI",u:"مساوات تنوع شمولیت",d:"Equity, Diversity, Inclusiveness - gender, race, ethnicity, disability, religion, age.",du:"مساوات، تنوع، شمولیت۔ صنف، نسل، مذہب، معذوری، عمر۔"},{t:"OECD",u:"او ای سی ڈی",d:"38 member countries, founded 1961 to stimulate economic progress and world trade.",du:"38 رکن ممالک، 1961 میں قائم۔ اقتصادی ترقی و عالمی تجارت۔"},{t:"Circle of Poverty",u:"غربت کا چکر",d:"Low Wealth > Limited education > Low technology > Low output > Low income > Little profit.",du:"کم دولت > محدود تعلیم > کم ٹیکنالوجی > کم پیداوار > کم آمدنی۔"},{t:"Technology",u:"ٹیکنالوجی",d:"Science of industrial arts. All methods humans use for production objectives.",du:"صنعتی فنون کی سائنس۔ پیداوار کے لیے طریقے۔"}]}];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=b[i];b[i]=b[j];b[j]=tmp;}return b;}
function terms(chs){var r=[];chs.forEach(function(i){D[i].t.forEach(function(x){r.push({t:x.t,u:x.u,d:x.d,du:x.du,c:D[i].c});});});return shuffle(r);}
var app=document.getElementById('app');
var S={m:null,ch:[0,1,2,3,4,5],ts:[],i:0,s:0,w:0,ans:[]};
function $(id){return document.getElementById(id);}

function home(){
S={m:null,ch:S.ch,ts:[],i:0,s:0,w:0,ans:[]};
var tc=terms(S.ch).length;
var h='<div class="hdr"><div class="brand">';
h+='<img src="'+IP+'" alt="">';
h+='<div><div class="org">PUNJAB DAANISH SCHOOLS & CENTRES OF EXCELLENCE AUTHORITY</div><div class="gov">Government of Punjab</div></div>';
h+='<img src="'+ID+'" alt="">';
h+='</div><h1>Geography 8 \u2014 Terminology Practice</h1>';
h+='<div class="urdu-t">\u062C\u063A\u0631\u0627\u0641\u06CC\u06C1 8 \u2014 \u0627\u0635\u0637\u0644\u0627\u062D\u0627\u062A \u06A9\u06CC \u0645\u0634\u0642</div>';
h+='<div class="sub">Based on Single National Curriculum 2022</div>';
h+='<div class="acard"><img src="'+IN+'" alt="">';
h+='<div><div class="nm">Dr. Naim Tahir Baig</div>';
h+='<div class="ti">Ph.D. International Relations<br>Senior Coordinator (6th\u20138th) \u2014 Centre of Excellence Sialkot (Boys)</div>';
h+='<div class="bk">\u270D\uFE0F Author of 140+ Internationally Published Books</div>';
h+='<div class="ct">\uD83D\uDCF1 Cell/WhatsApp: <a href="https://wa.me/923417007400">0341-7007400</a></div>';
h+='</div></div></div>';
h+='<div class="csel"><label>SELECT CHAPTERS ('+tc+' terms)</label><div class="chips">';
h+='<div class="chip'+(S.ch.length===6?' on':'')+'" data-i="all">All</div>';
D.forEach(function(d,i){h+='<div class="chip'+(S.ch.indexOf(i)>=0?' on':'')+'" data-i="'+i+'">'+d.c+' ('+d.t.length+')</div>';});
h+='</div></div><div class="mg">';
h+='<div class="mc" onclick="go(\'mcq\')"><div class="ic">\uD83C\uDFAF</div><div class="mt">MCQ Quiz</div><div class="md">Multiple choice. Randomized every time!</div></div>';
h+='<div class="mc" onclick="go(\'type\')"><div class="ic">\u2328\uFE0F</div><div class="mt">Type the Term</div><div class="md">Read definition, type the correct term.</div></div>';
h+='<div class="mc" onclick="go(\'flash\')"><div class="ic">\uD83C\uDCCF</div><div class="mt">Flashcards</div><div class="md">Flip cards for definitions with Urdu.</div></div>';
h+='<div class="mc" onclick="go(\'match\')"><div class="ic">\uD83D\uDD17</div><div class="mt">Match Terms</div><div class="md">Match terms to definitions. 6 per round.</div></div>';
h+='</div>';
app.innerHTML=h;
document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){
var v=this.dataset.i;
if(v==='all'){S.ch=[0,1,2,3,4,5];}else{var idx=parseInt(v);var p=S.ch.indexOf(idx);if(p>=0)S.ch.splice(p,1);else S.ch.push(idx);if(!S.ch.length)S.ch=[0,1,2,3,4,5];}
home();};});}

function go(m){S.m=m;S.i=0;S.s=0;S.w=0;S.ans=[];S.ts=terms(S.ch);if(m==='mcq')mcq();else if(m==='type')typ();else if(m==='flash')flash();else mat();}

function mcq(){if(S.i>=S.ts.length){res();return;}
var t=S.ts[S.i],p=(S.i/S.ts.length*100)|0;
var pool=S.ts.filter(function(x){return x.t!==t.t;});
var opts=shuffle([t].concat(shuffle(pool).slice(0,3)));
var h='<div class="hdr"><h1>MCQ Quiz</h1></div><div class="pbar"><div class="pfill" style="width:'+p+'%"></div></div>';
h+='<div class="qstats"><span>Q '+(S.i+1)+' / '+S.ts.length+'</span><span><span class="sb sb-c">\u2713 '+S.s+'</span> <span class="sb sb-w">\u2717 '+S.w+'</span></span></div>';
h+='<div class="qcard"><div class="qch">'+t.c+'</div><div class="qt">What is the definition of <span style="color:var(--gold);font-weight:700">\u201C'+t.t+'\u201D</span>?</div>';
h+='<div class="qu">'+t.u+' \u06A9\u06CC \u062A\u0639\u0631\u06CC\u0641 \u06A9\u06CC\u0627 \u06C1\u06D2\u061F</div><div class="opts" id="opts">';
opts.forEach(function(o,i){h+='<div class="opt" data-ok="'+(o.t===t.t?1:0)+'"><span class="lt">'+'ABCD'[i]+'</span><span>'+o.d+'</span></div>';});
h+='</div><div id="fb"></div></div><div class="ar"><button class="btn btn-o" onclick="home()">\u2190 Home</button><button class="btn btn-g" id="nxt" style="display:none" onclick="S.i++;mcq()">Next \u2192</button></div>';
app.innerHTML=h;
document.querySelectorAll('.opt').forEach(function(el){el.onclick=function(){
if(el.classList.contains('dis'))return;
document.querySelectorAll('.opt').forEach(function(o){o.classList.add('dis');});
var ok=el.dataset.ok==='1';
if(ok){el.classList.add('co');S.s++;}else{el.classList.add('wo');S.w++;document.querySelectorAll('.opt').forEach(function(o){if(o.dataset.ok==='1')o.classList.add('co');});}
S.ans.push({t:t.t,u:t.u,d:t.d,du:t.du,ok:ok});
$('fb').innerHTML=ok?'<div class="fb fb-c">\u2705 Correct!</div>':'<div class="fb fb-w">\u274C Correct: <strong>'+t.d+'</strong></div>';
$('nxt').style.display='inline-flex';};});}

function typ(){if(S.i>=S.ts.length){res();return;}
var t=S.ts[S.i],p=(S.i/S.ts.length*100)|0;
var h='<div class="hdr"><h1>Type the Term</h1></div><div class="pbar"><div class="pfill" style="width:'+p+'%"></div></div>';
h+='<div class="qstats"><span>Q '+(S.i+1)+' / '+S.ts.length+'</span><span><span class="sb sb-c">\u2713 '+S.s+'</span> <span class="sb sb-w">\u2717 '+S.w+'</span></span></div>';
h+='<div class="qcard"><div class="qch">'+t.c+'</div><div class="qi">Read the definition and type the correct term:</div>';
h+='<div class="qt" style="font-size:1rem;font-weight:400;line-height:1.7">'+t.d+'</div><div class="qu">'+t.du+'</div>';
h+='<input type="text" class="tinp" id="inp" placeholder="Type term here..." autocomplete="off"><div id="fb"></div></div>';
h+='<div class="ar"><button class="btn btn-o" onclick="home()">\u2190 Home</button><button class="btn btn-g" id="chk" onclick="chk()">Check \u2713</button>';
h+='<button class="btn btn-g" id="nxt" style="display:none" onclick="S.i++;typ()">Next \u2192</button></div>';
app.innerHTML=h;var inp=$('inp');
inp.onkeydown=function(e){if(e.key==='Enter'){$('nxt').style.display!=='none'?(S.i++,typ()):chk();}};
setTimeout(function(){inp.focus();},100);}

function chk(){var inp=$('inp'),v=inp.value.trim().toLowerCase(),t=S.ts[S.i],c=t.t.toLowerCase();
var ok=v===c;inp.disabled=true;$('chk').style.display='none';
ok?(inp.classList.add('ci'),S.s++):(inp.classList.add('wi'),S.w++);
S.ans.push({t:t.t,u:t.u,d:t.d,du:t.du,ok:ok});
$('fb').innerHTML=ok?'<div class="fb fb-c">\u2705 '+t.t+' ('+t.u+')</div>':'<div class="fb fb-w">\u274C Answer: <strong>'+t.t+'</strong> ('+t.u+')</div>';
$('nxt').style.display='inline-flex';}

function flash(){if(S.i>=S.ts.length){home();return;}var t=S.ts[S.i];
var h='<div class="hdr"><h1>Flashcards</h1><div class="sub">'+(S.i+1)+' / '+S.ts.length+' \u2014 '+t.c+'</div></div>';
h+='<div class="pbar"><div class="pfill" style="width:'+((S.i/S.ts.length*100)|0)+'%"></div></div>';
h+='<div class="fcw" onclick="document.getElementById(\'fc\').classList.toggle(\'flip\')">';
h+='<div class="fc" id="fc"><div class="fcf fcfr"><div class="fterm">'+t.t+'</div><div class="furdu">'+t.u+'</div><div class="fhint">tap to reveal</div></div>';
h+='<div class="fcf fcbk"><div class="fdef">'+t.d+'</div><div class="fdefu">'+t.du+'</div></div></div></div>';
h+='<div class="ar"><button class="btn btn-o" onclick="home()">\u2190 Home</button>';
if(S.i>0)h+='<button class="btn btn-o" onclick="S.i--;flash()">\u2190 Prev</button>';
h+='<button class="btn btn-g" onclick="S.i++;flash()">Next \u2192</button></div>';
app.innerHTML=h;}

function mat(){var all=terms(S.ch).slice(0,6);if(all.length<2){home();return;}
var tc=shuffle(all.map(function(t,i){return{p:i,text:t.t};}));
var dc=shuffle(all.map(function(t,i){return{p:i,text:t.d.length>80?t.d.slice(0,80)+'\u2026':t.d};}));
var sel=null,sc=0;
var h='<div class="hdr"><h1>Match Terms</h1><div class="sub">Match each term to its definition</div></div>';
h+='<div id="ms" style="text-align:center;margin:12px 0;font-size:.85rem;color:var(--text-dim)">Matched: 0 / '+all.length+'</div><div class="matchg"><div>';
h+='<div style="font-size:.68rem;color:var(--gold);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Terms</div>';
tc.forEach(function(c,i){h+='<div class="matchc mterm" data-p="'+c.p+'" data-t="t" id="mt'+i+'">'+c.text+'</div>';});
h+='</div><div><div style="font-size:.68rem;color:var(--gold);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Definitions</div>';
dc.forEach(function(c,i){h+='<div class="matchc" data-p="'+c.p+'" data-t="d" id="md'+i+'">'+c.text+'</div>';});
h+='</div></div><div class="ar"><button class="btn btn-o" onclick="home()">\u2190 Home</button><button class="btn btn-g" onclick="mat()">\uD83D\uDD04 New Round</button></div>';
app.innerHTML=h;
document.querySelectorAll('.matchc').forEach(function(el){el.onclick=function(){
if(el.classList.contains('mok'))return;
if(!sel){sel=el;el.classList.add('msel');}else{
var f=sel;if(f===el){f.classList.remove('msel');sel=null;return;}
if(f.dataset.t===el.dataset.t){f.classList.remove('msel');sel=el;el.classList.add('msel');return;}
if(f.dataset.p===el.dataset.p){f.classList.remove('msel');f.classList.add('mok');el.classList.add('mok');sc++;$('ms').textContent='Matched: '+sc+' / '+all.length;
if(sc===all.length)$('ms').innerHTML='<span style="color:var(--correct);font-weight:700">\uD83C\uDFC6 All matched!</span>';}
else{f.classList.remove('msel');el.classList.add('mwrong');f.classList.add('mwrong');setTimeout(function(){el.classList.remove('mwrong');f.classList.remove('mwrong');},400);}
sel=null;}};});}

function res(){var tot=S.ts.length,pct=tot?Math.round(S.s/tot*100):0,off=452.4-(452.4*pct/100);
var wrongs=S.ans.filter(function(a){return !a.ok;});
var h='<div class="hdr"><h1>Quiz Complete!</h1><div class="urdu-t">\u06A9\u0648\u0626\u0632 \u0645\u06A9\u0645\u0644!</div></div><div style="text-align:center">';
h+='<div class="sring"><svg width="170" height="170"><circle class="rbg"/><circle class="rfill" id="rf"/></svg><div class="stxt">'+pct+'%</div></div>';
h+='<div class="slbl">You got <strong>'+S.s+'</strong> out of <strong>'+tot+'</strong> correct</div>';
h+='<div class="rstats"><div class="rst"><div class="n" style="color:var(--correct)">'+S.s+'</div><div class="l">Correct</div></div>';
h+='<div class="rst"><div class="n" style="color:var(--wrong)">'+S.w+'</div><div class="l">Wrong</div></div>';
h+='<div class="rst"><div class="n" style="color:var(--gold)">'+tot+'</div><div class="l">Total</div></div></div>';
if(wrongs.length){h+='<div style="text-align:left;margin-bottom:10px;font-weight:600;color:var(--wrong);font-size:.85rem">Review Incorrect:</div><div class="rvl">';
wrongs.forEach(function(a){h+='<div class="rvi"><span style="flex-shrink:0">\u274C</span><div><span class="rvt">'+a.t+'</span> <span style="color:var(--urdu)">('+a.u+')</span><br><span class="rva">'+a.d+'</span></div></div>';});
h+='</div>';}else{h+='<div style="color:var(--correct);font-size:1.05rem;font-weight:600;margin:18px 0">\uD83C\uDFC6 Perfect Score!</div>';}
h+='<div class="ar" style="margin-top:20px"><button class="btn btn-o" onclick="home()">\u2190 Home</button><button class="btn btn-g" onclick="go(S.m)">\uD83D\uDD04 Retry</button></div></div>';
app.innerHTML=h;setTimeout(function(){var r=$('rf');if(r)r.style.strokeDashoffset=off;},100);}

home();
</script></body></html>
